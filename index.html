// ============ YARDIMCI FONKSİYONLAR ============
function dateKey(d) {
return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function monthKey(d) {
return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function fmtTime(d) {
return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDateTR(d) {
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
return d.getDate() + ' ' + AY[d.getMonth()] + ' ' + d.getFullYear() + ', ' + GUN[d.getDay()];
}
function initials(name) { return name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
function shortName(fullName) {
if (!fullName) return '';
const parts = fullName.trim().split(/\s+/);
if (parts.length === 1) return parts[0];
return parts[0] + ' ' + parts[parts.length-1].charAt(0).toUpperCase() + '.';
}
function getWeekDatesForDate(date) {
const d = new Date(date);
const day = d.getDay();
const diff = day === 0 ? -6 : 1 - day;
const monday = new Date(d);
monday.setDate(d.getDate() + diff);
monday.setHours(0,0,0,0);
const arr = [];
for (let i = 0; i < 7; i++) { const x = new Date(monday); x.setDate(monday.getDate() + i); arr.push(x); }
return arr;
}
function getCurrentWeekDates() { return getWeekDatesForDate(state.weekAnchorDate); }
function toMin(hhmm) { if (!hhmm) return 0; const p = hhmm.split(':'); return parseInt(p[0],10) * 60 + (parseInt(p[1],10) || 0); }
function isLeaveType(t) { return t === 'izinli' || t === RECEIVABLE_LEAVE_TYPE; }
function shiftDurationMin(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
if (!shift.start || !shift.end) return 0;
return (toMin(shift.end) - toMin(shift.start) + 1440) % 1440;
}
function shiftHours(shift) { return shiftDurationMin(shift) / 60; }
function getAutoBreak(grossHours) {
const rules = (data.settings.breakRules || []).slice().sort(function(a,b){return a.minHours - b.minHours;});
if (!rules.length) return 0;
for (let i = 0; i < rules.length; i++) {
const r = rules[i];
const min = typeof r.minHours === 'number' ? r.minHours : 0;
const max = typeof r.maxHours === 'number' ? r.maxHours : Infinity;
if (grossHours >= min && grossHours < max) return r.breakMin;
}
return rules[rules.length-1].breakMin;
}
function shiftNetHours(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
const grossH = shiftHours(shift);
if (grossH <= 0) return 0;
return Math.max(0, grossH - getAutoBreak(grossH) / 60);
}
function shiftAlacakHours(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
return parseFloat(shift.alacakHours) || 0;
}
function fmtNetHoursShort(hours) {
if (!hours || hours <= 0) return '0';
const r = Math.round(hours * 100) / 100;
if (Math.abs(r - Math.round(r)) < 0.01) return String(Math.round(r));
let s = r.toFixed(2);
s = s.replace(/0+$/, '');
s = s.replace(/\.$/, '');
s = s.replace('.', ',');
return s;
}
function isNightShift(start, end) {
const s = toMin(start); const e = toMin(end);
const dur = (e - s + 1440) % 1440;
let nightMin = 0;
for (let i = 0; i < dur; i++) { const cur = (s + i) % 1440; if (cur >= 20*60 || cur < 6*60) nightMin++;}
return nightMin > dur / 2;
}
function getShiftColor(start, end) {
if (!start || !end) return null;
const mid = (toMin(start) + toMin(end)) / 2;
const midNorm = ((mid % 1440) + 1440) % 1440;
const rules = data.settings.colorRules || [];
for (let i = 0; i < rules.length; i++) {
const r = rules[i];
const rs = toMin(r.start); const re = toMin(r.end);
if (rs < re) { if (midNorm >= rs && midNorm < re) return r.color; }
else { if (midNorm >= rs || midNorm < re) return r.color; }
}
return null;
}
function validateShift(shift) {
const errors = [];
if (!shift || isLeaveType(shift.type)) return errors;
if (!shift.start || !shift.end) { errors.push('Başlangıç ve bitiş saati zorunlu'); return errors; }
const grossH = shiftHours(shift);
const netH = Math.max(0, grossH - getAutoBreak(grossH) / 60);
if (netH > 11) errors.push('Günlük 11 saat sınırı aşılıyor (net ' + netH.toFixed(1) + ' sa)');
if (isNightShift(shift.start, shift.end) && netH > 7.5) errors.push('Gece çalışması 7.5 saati aşamaz (net ' + netH.toFixed(1) + ' sa)');
return errors;
}

return totalH;
}

function getMonthByOffset(monthOffset) {

function getTotalMonthHoursForMonth(monthOffset) {
const mPrefix = monthKey(getMonthByOffset(monthOffset));
const list = data.settings.staff || [];
let totalH = 0;
Object.entries(data.weekPlan || {}).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
if (dk.indexOf(mPrefix) !== 0) return;
list.forEach(function(s){
const sh = (dayPlan || {})[s.id];
if (sh && sh.type && !isLeaveType(sh.type)) totalH += shiftNetHours(sh);
});
});
return totalH;
}
function getMonthWeekBuckets(monthOffset) {
const first = getMonthByOffset(monthOffset);
const year = first.getFullYear(), month = first.getMonth();
const daysInMonth = new Date(year, month + 1, 0).getDate();
const buckets = [];
const firstDay = first.getDay();
const firstDayMB = firstDay === 0 ? 7 : firstDay;
let currentDay = 1, weekNum = 1;
const firstWeekDays = firstDayMB === 1 ? 7 : (8 - firstDayMB);
const firstWeekEnd = Math.min(firstWeekDays, daysInMonth);
buckets.push({ index: weekNum, startDay: 1, endDay: firstWeekEnd, days: firstWeekEnd, isExtra: false, isPartial: firstDayMB !== 1 });
currentDay = firstWeekEnd + 1; weekNum++;
while (currentDay + 6 <= daysInMonth) {
buckets.push({ index: weekNum, startDay: currentDay, endDay: currentDay + 6, days: 7, isExtra: false, isPartial: false });
currentDay += 7; weekNum++;
}
if (currentDay <= daysInMonth) {
const rem = daysInMonth - currentDay + 1;
buckets.push({ index: weekNum, startDay: currentDay, endDay: daysInMonth, days: rem, isExtra: true, isPartial: false });
}
return { buckets: buckets, daysInMonth: daysInMonth };
}
function getManualExtra(staffId, monthOffset) {
const mk = monthKey(getMonthByOffset(monthOffset));
return (data.manualExtra[staffId] || {})[mk] || 0;
}
function setManualExtra(staffId, monthOffset, hours) {

function getWeeklyExtraDetails(staffId, monthOffset) {
const so = data.settings.staff.find(function(s){return s.id === staffId;});
if (!so || (so.role !== 'ft' && so.role !== 'manager')) return { total: 0, weeks: [] };
const weeklyLimit = data.settings.weeklyLimitHours || 45;
const mPrefix = monthKey(getMonthByOffset(monthOffset));
const weekMap = {};
Object.entries(data.weekPlan || {}).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
const sh = (dayPlan || {})[staffId];
if (!sh || !sh.type || isLeaveType(sh.type)) return;
const p = dk.split('-').map(Number);
const dt = new Date(p[0], p[1]-1, p[2]);
const day = dt.getDay();
const diff = day === 0 ? -6 : 1 - day;
const mon = new Date(dt);
mon.setDate(dt.getDate() + diff);
const wk = dateKey(mon);
weekMap[wk] = (weekMap[wk] || 0) + shiftNetHours(sh);
});
const weeks = [];
Object.entries(weekMap).forEach(function(entry){
const wk = entry[0]; const hours = entry[1];
if (wk.indexOf(mPrefix) !== 0) return;
const over = hours - weeklyLimit;
if (over > 0.01) {
const p = wk.split('-').map(Number);
const mon = new Date(p[0], p[1]-1, p[2]);
const sun = new Date(mon);
sun.setDate(mon.getDate() + 6);
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
weeks.push({ weekKey: wk, label: mon.getDate() + ' ' + AY[mon.getMonth()] + ' – ' + sun.getDate() + ' ' + AY[sun.getMonth()], over: over, total: hours });
}
});
weeks.sort(function(a,b){return a.weekKey.localeCompare(b.weekKey);});

}
function getReceivableUsageDetails(staffId, monthOffset) {

if (sh.type === RECEIVABLE_LEAVE_TYPE) uses.push({ dateKey: dk, hours: RECEIVABLE_LEAVE_HOURS });
else if (!isLeaveType(sh.type) && shiftAlacakHours(sh) > 0) uses.push({ dateKey: dk, hours: shiftAlacakHours(sh) });
});
uses.sort(function(a,b){return a.dateKey.localeCompare(b.dateKey);});

function getFirstMondayOfMonth(monthOffset) {
const first = getMonthByOffset(monthOffset);

const firstDayMB = day === 0 ? 7 : day;
const monday = new Date(first);

function getWeeksInMonth(year, month) {
const first = new Date(year, month, 1);

const firstDayMB = first.getDay() === 0 ? 7 : first.getDay();
const weeks = [];
let mon = new Date(first);
mon.setDate(first.getDate() - (firstDayMB - 1));
mon.setHours(0,0,0,0);
const endOfMonth = new Date(year, month, daysInMonth);
while (mon <= endOfMonth) {
const end = new Date(mon);
end.setDate(mon.getDate() + 6);
weeks.push({ start: new Date(mon), end: end });
mon = new Date(mon);
mon.setDate(mon.getDate() + 7);
}
return weeks;
}

// ============ FIREBASE SENKRON ============
let _fbReady = false;
let _saveTimer = null;
let _applyingRemote = false;
const FB_DOC_PATH = ['shared', 'state'];

function initFirebase() {
const fb = window.__fb;
if (!fb) { setTimeout(initFirebase, 100); return; }
fb.signInAnonymously(fb.auth).catch(function(err){
console.error('Anonim giriş hatası:', err);
});
fb.onAuthStateChanged(fb.auth, function(user){
if (!user) return;
_fbReady = true;
fbSubscribe();
});
}

async function fbSubscribe() {
const fb = window.__fb;
const ref = fb.doc(fb.db, FB_DOC_PATH[0], FB_DOC_PATH[1]);
try {
const snap = await fb.getDoc(ref);
if (snap.exists()) {
applyRemote(snap.data(), false);
} else {
seedDemoWeekPlan();
await fbSaveNow();
}
} catch (e) {
console.error('İlk okuma hatası:', e);
render();
return;
}
fb.onSnapshot(ref, function(s){
if (!s.exists()) return;
if (s.metadata.hasPendingWrites) return;
applyRemote(s.data(), true);
}, function(err){
console.error('Snapshot hatası:', err);
});
render();
}

function applyRemote(remote, isUpdate) {
_applyingRemote = true;
data.settings = Object.assign({}, DEFAULT_SETTINGS, remote.settings || {});
if (remote.settings) {
if (remote.settings.shiftChips) data.settings.shiftChips = remote.settings.shiftChips;
if (remote.settings.colorRules) data.settings.colorRules = remote.settings.colorRules;
if (remote.settings.breakRules) data.settings.breakRules = remote.settings.breakRules;
if (remote.settings.staff) data.settings.staff = remote.settings.staff;
if (remote.settings.monthlyTargetsByMonth) data.settings.monthlyTargetsByMonth = remote.settings.monthlyTargetsByMonth;
}
data.weekPlan = remote.weekPlan || {};
data.manualExtra = remote.manualExtra || {};
_applyingRemote = false;
if (isUpdate && !state.modal && !state.showSettings && !state.clearMenuOpen && !state.weekPickerOpen) {
render();
}
}

async function fbSaveNow() {
const fb = window.__fb;
if (!fb || !_fbReady) return;
setSyncBadge('saving');
try {
await fb.setDoc(fb.doc(fb.db, FB_DOC_PATH[0], FB_DOC_PATH[1]), {
settings: data.settings,
weekPlan: data.weekPlan,
manualExtra: data.manualExtra
});
setSyncBadge('online');
} catch (e) {
console.error('Kayıt hatası:', e);
setSyncBadge('offline');
}
}

function lsSave() {
if (_applyingRemote) return;
clearTimeout(_saveTimer);
_saveTimer = setTimeout(function(){ if (_fbReady) fbSaveNow(); }, 400);
}

function setSyncBadge(mode) {
const el = document.getElementById('syncBadge');
if (!el) return;
el.className = 'sync-badge ' + mode;
if (mode === 'online') el.innerHTML = '<span class="dot"></span> CANLI';
else if (mode === 'saving') el.innerHTML = '<span class="dot"></span> KAYDEDİLİYOR';
else el.innerHTML = '<span class="dot"></span> OFFLINE';
}

const plan = [
{ nejla: S, hikmet: A, kader: I, seyma: S, tugba: A, ayse: S },

{ nejla: A, hikmet: S, kader: S, seyma: A, tugba: S, ayse: S },
{ nejla: S, hikmet: S, kader: A, seyma: A, tugba: I, ayse: S },
{ nejla: S, hikmet: A, kader: S, seyma: T, tugba: S, ayse: A },
{ nejla: A, hikmet: T, kader: A, seyma: T, tugba: S, ayse: A },

 ];

const dk = dateKey(d);

// ============ SÜRÜKLE-BIRAK SIRALAMA ============
function startDragSort() {
const container = document.getElementById('weeklyHoursScroll');
if (!container) return;
const items = Array.from(container.querySelectorAll('[data-wh-staff]'));
let dragIdx = -1;
let dragged = null;

const onDown = function(e, item, idx) {
if (e.target.closest('[data-staff-name-cell]')) return;
dragged = item;
dragIdx = idx;
item.classList.add('dragging');
};
const onMove = function(e) {
if (!dragged) return;
const x = e.touches ? e.touches[0].clientX : e.clientX;
const y = e.touches ? e.touches[0].clientY : e.clientY;
items.forEach(function(it){
if (it === dragged) return;
const r = it.getBoundingClientRect();
it.classList.remove('drag-over-left', 'drag-over-right');
});
};
const onUp = function(e) {
if (!dragged) return;
const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
let targetIdx = -1;
let side = 'right';
items.forEach(function(it, idx){
const r = it.getBoundingClientRect();
if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
targetIdx = idx;
side = x < r.left + r.width / 2 ? 'left' : 'right';
}
});
if (targetIdx >= 0 && targetIdx !== dragIdx) {
const staffList = data.settings.staff;
const movedId = items[dragIdx].dataset.whStaff;
const fromIdx = staffList.findIndex(function(s){return s.id === movedId;});
if (fromIdx >= 0) {
const moved = staffList.splice(fromIdx, 1)[0];
const targetId = items[targetIdx].dataset.whStaff;
let toIdx = staffList.findIndex(function(s){return s.id === targetId;});
if (toIdx < 0) toIdx = staffList.length;
else if (side === 'right') toIdx = toIdx + 1;
staffList.splice(toIdx, 0, moved);
lsSave();
showToast('↕️ Sıralama kaydedildi', 'info');
}
}
items.forEach(function(it){ it.classList.remove('dragging', 'drag-over-left', 'drag-over-right'); });
dragged = null;
dragIdx = -1;
render();
};

items.forEach(function(item, idx){
let pressTimer = null;
let isDragging = false;
const startPress = function(e) {
if (e.target.closest('input')) return;
pressTimer = setTimeout(function(){
isDragging = true;
if (navigator.vibrate) navigator.vibrate(15);
onDown(e, item, idx);
}, 220);
};
const cancelPress = function(e) {
if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
if (isDragging) { onUp(e); isDragging = false; }
};
item.addEventListener('touchstart', function(e){ startPress(e); }, { passive: true });
item.addEventListener('touchmove', function(e){ if (isDragging) { e.preventDefault(); onMove(e); } }, { passive: false });
item.addEventListener('touchend', function(e){ cancelPress(e); });
item.addEventListener('mousedown', function(e){ e.preventDefault(); startPress(e); });
item.addEventListener('mousemove', function(e){ if (isDragging) onMove(e); });
item.addEventListener('mouseup', function(e){ cancelPress(e); });
});
}

state.alacakToggleOn = false;
state.alacakHours = 3;
if (cur && !isLeaveType(cur.type)) {
if (cur.start) { const p = cur.start.split(':'); state.modal.startHour = parseInt(p[0],10); state.modal.startMinute = parseInt(p[1],10); }
if (cur.end) { const p = cur.end.split(':'); state.modal.endHour = parseInt(p[0],10); state.modal.endMinute = parseInt(p[1],10); }
if (shiftAlacakHours(cur) > 0) { state.alacakToggleOn = true; state.alacakHours = shiftAlacakHours(cur); }
}
render();
}
function autoSaveShift(force) {
const m = state.modal; if (!m) return;
if (m.startHour === null || m.startMinute === null || m.endHour === null || m.endMinute === null) return;
const startStr = String(m.startHour).padStart(2,'0') + ':' + String(m.startMinute).padStart(2,'0');
const endStr = String(m.endHour).padStart(2,'0') + ':' + String(m.endMinute).padStart(2,'0');
const durH = ((toMin(endStr) - toMin(startStr) + 1440) % 1440) / 60;
let type = 'sabah';
if (durH >= 10) type = 'tam';
else if (isNightShift(startStr, endStr)) type = 'gece';
else if (toMin(startStr) >= 12 * 60) type = 'aksam';
const mData = { type: type, start: startStr, end: endStr };
if (state.alacakToggleOn && state.alacakHours > 0) mData.alacakHours = state.alacakHours;
const errors = validateShift(mData);
if (errors.length > 0 && !force) {
state.warnConfirm = { mData: mData, dateKey: m.dateKey, staffId: m.staffId, errors: errors };
render(); return;
}
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = mData;
lsSave();
state.modal = null; state.warnConfirm = null;
showToast('✅ ' + startStr + ' - ' + endStr, 'success');
render();
}
function saveShiftAsIzinli() {
const m = state.modal; if (!m) return;
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: 'izinli', start: '', end: '' };
lsSave(); state.modal = null;
showToast('🏖️ İzinli kaydedildi', 'success'); render();
}
function saveShiftAsAlacakIzinli() {
const m = state.modal; if (!m) return;
const avail = getAvailableReceivableForWeek(m.staffId);
if (avail < RECEIVABLE_LEAVE_HOURS) { showToast('Yetersiz alacak', 'error'); return; }
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: RECEIVABLE_LEAVE_TYPE, start: '', end: '' };
lsSave(); state.modal = null;
showToast('💰 Alacak izni (7,5 sa)', 'success'); render();
}
function saveShiftAsFull(chip) {
const m = state.modal; if (!m) return;
const start = chip.start || '10:00';
const end = chip.end || '22:00';
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: 'tam', start: start, end: end };
lsSave(); state.modal = null;
showToast('✅ ' + chip.name + ' kaydedildi', 'success'); render();
}
function deleteShiftEdit() {
const m = state.modal; if (!m) return;
if (data.weekPlan[m.dateKey]) {
delete data.weekPlan[m.dateKey][m.staffId];
if (Object.keys(data.weekPlan[m.dateKey]).length === 0) delete data.weekPlan[m.dateKey];
}
lsSave(); state.modal = null;
showToast('🗑️ Vardiya silindi', 'info'); render();
}
function selectChip(chipId) {
const m = state.modal; if (!m) return;
const chip = data.settings.shiftChips.find(function(c){return c.id === chipId;});
if (!chip) return;
if (chip.type === 'full') { saveShiftAsFull(chip); return; }
if (chip.type === 'izinli') { saveShiftAsIzinli(); return; }
if (chip.type === RECEIVABLE_LEAVE_TYPE) {
const avail = getAvailableReceivableForWeek(m.staffId);
if (avail < RECEIVABLE_LEAVE_HOURS) { showToast('Yetersiz alacak', 'error'); return; }
saveShiftAsAlacakIzinli(); return;
}
m.activeChipId = chipId;
m.step = 'start-hour';
render();
}
function pickHour(which, hour) {
const m = state.modal; if (!m) return;
if (which === 'start') { m.startHour = hour; m.startMinute = null; m.step = 'start-minute'; }
else { m.endHour = hour; m.endMinute = null; m.step = 'end-minute'; }
render();
}
function pickMinute(which, minute) {
const m = state.modal; if (!m) return;
if (which === 'start') { m.startMinute = minute; m.step = 'end-hour'; render(); }
else { m.endMinute = minute; setTimeout(function(){ autoSaveShift(false); }, 0); }
}
function goToManual() { const m = state.modal; if (!m) return; m.step = 'manual'; render(); }
function toggleAlacak() {
const m = state.modal; if (!m) return;
const avail = getAvailableReceivableForWeek(m.staffId);
if (!state.alacakToggleOn && avail <= 0.01) { showToast('Kullanılabilir alacak yok', 'error'); return; }
state.alacakToggleOn = !state.alacakToggleOn;
render();
}
function setAlacakHours(v) { state.alacakHours = v; render(); }
function goToWarningCell(staffId, dateKey) {
if (!staffId || !dateKey) { showToast('Hedef gün bulunamadı', 'warn'); return; }
document.querySelectorAll('.plan-cell.edit-hint').forEach(function(el){ el.classList.remove('edit-hint'); });
const cell = document.querySelector('.plan-cell[data-staff="' + staffId + '"][data-date="' + dateKey + '"]');
if (!cell) { showToast('Hedef gün bulunamadı', 'warn'); return; }
cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
cell.classList.add('edit-hint');
const rect = cell.getBoundingClientRect();
const tooltip = document.createElement('div');
tooltip.className = 'plan-cell-tooltip';
tooltip.textContent = '✏️ Düzenlemek için tıkla';
tooltip.style.left = Math.max(8, rect.left + rect.width / 2 - 80) + 'px';
tooltip.style.top = Math.max(60, rect.top - 40) + 'px';
document.body.appendChild(tooltip);
setTimeout(function(){ tooltip.remove(); }, 3500);
}

// ============ PERSONEL YÖNETİMİ ============
function openStaffManager() { state.modal = { type: 'staffManager' }; render(); }
function openStaffForm(staffId) {
if (staffId) {
const st = data.settings.staff.find(function(s){return s.id === staffId;});
state.editingStaff = Object.assign({}, st, { color: st.color ? Object.assign({}, st.color) : null });
} else {
state.editingStaff = { id: 'staff_' + Date.now(), name: '', role: 'pt', title: '', color: Object.assign({}, DEFAULT_STAFF_COLORS.pt) };
}
state.modal = { type: 'staffForm' };
render();
}
function saveStaffForm() {
const st = state.editingStaff;
if (!st || !st.name.trim()) { showToast('İsim girin', 'error'); return; }
if (!st.title || !st.title.trim()) st.title = (ROLES[st.role] && ROLES[st.role].label) || 'Personel';
const idx = data.settings.staff.findIndex(function(s){return s.id === st.id;});
if (idx >= 0) data.settings.staff[idx] = st;
else data.settings.staff.push(st);
lsSave();
state.editingStaff = null;
state.modal = { type: 'staffManager' };
showToast('✅ Personel kaydedildi', 'success');
render();
}
function deleteStaff(staffId) {
if (!confirm('Bu personeli silmek istediğinize emin misiniz?')) return;
data.settings.staff = data.settings.staff.filter(function(s){return s.id !== staffId;});
Object.keys(data.weekPlan).forEach(function(dk){
if (data.weekPlan[dk][staffId]) delete data.weekPlan[dk][staffId];
});
lsSave();
showToast('🗑️ Personel silindi', 'info');
render();
}

// ============ AYARLAR ============
function openSettings() {
state.editingSettings = JSON.parse(JSON.stringify(data.settings));
state.settingsTab = 'general';
state.showSettings = true;
state.chipEditEmojiTarget = null;
render();
}

// ============ SIFIRLA ============
function openClearMenu() { state.clearMenuOpen = true; state.clearSelectedStaff = []; state.clearSelectedDays = []; render(); }
function closeClearMenu() { state.clearMenuOpen = false; render(); }
function toggleClearStaff(id) {
const i = state.clearSelectedStaff.indexOf(id);
if (i >= 0) state.clearSelectedStaff.splice(i, 1);
else state.clearSelectedStaff.push(id);
render();
}
function toggleClearDay(i) {
const idx = state.clearSelectedDays.indexOf(i);
if (idx >= 0) state.clearSelectedDays.splice(idx, 1);
else state.clearSelectedDays.push(i);
render();
}
function selectAllClearStaff() {
const all = data.settings.staff.map(function(s){return s.id;});
state.clearSelectedStaff = state.clearSelectedStaff.length === all.length ? [] : all;
render();
}
function selectAllClearDays() {
state.clearSelectedDays = state.clearSelectedDays.length === 7 ? [] : [0,1,2,3,4,5,6];
render();
}
function applyClear() {
if (!state.clearSelectedStaff.length) { showToast('Personel seç', 'warn'); return; }
if (!state.clearSelectedDays.length) { showToast('Gün seç', 'warn'); return; }
const weekDates = getCurrentWeekDates();
let count = 0;
state.clearSelectedDays.forEach(function(i){
const dk = dateKey(weekDates[i]);
if (!data.weekPlan[dk]) return;
state.clearSelectedStaff.forEach(function(sid){
if (data.weekPlan[dk][sid]) { delete data.weekPlan[dk][sid]; count++; }
});
if (!Object.keys(data.weekPlan[dk]).length) delete data.weekPlan[dk];
});
lsSave();
state.clearMenuOpen = false;
showToast('🗑️ ' + count + ' vardiya silindi', 'info');
render();
}

// ============ HAFTA SEÇİCİ ============
function openWeekPicker() {
state.weekPickerOpen = true;
state.weekPickerYear = state.weekAnchorDate.getFullYear();
state.weekPickerMonth = state.weekAnchorDate.getMonth();
render();
}
function closeWeekPicker() { state.weekPickerOpen = false; render(); }
function wpChangeYear(d) { state.weekPickerYear += d; render(); }
function wpPickMonth(m) { state.weekPickerMonth = m; render(); }
function wpPickWeek(start) {
state.weekAnchorDate = new Date(start);
state.weekAnchorDate.setHours(0,0,0,0);
state.selectedMonthOffset = (start.getFullYear() - new Date().getFullYear()) * 12 + (start.getMonth() - new Date().getMonth());
state.weekPickerOpen = false;
render();
}
</script>
<script>
// ============ RENDER ============
function render() {
const app = document.getElementById('app');
if (!app) return;
app.innerHTML =
'<div class="sync-badge ' + (_fbReady ? 'online' : 'saving') + '" id="syncBadge"><span class="dot"></span> ' + (_fbReady ? 'CANLI' : 'BAĞLANIYOR') + '</div>' +
renderHeader() +
renderDateTimeBar() +
renderHourTargetCard() +
renderWeeklyHoursCard() +
renderWeekPlan() +
renderReceivableCard() +
renderWarnings() +
renderFooter() +
(state.showSettings ? renderSettingsPage() : '') +
(state.modal && state.modal.type === 'shiftEdit' ? renderShiftEditModal() : '') +
(state.modal && state.modal.type === 'staffManager' ? renderStaffManagerModal() : '') +
(state.modal && state.modal.type === 'staffForm' ? renderStaffFormModal() : '') +
(state.chipEditEmojiTarget !== null ? renderEmojiPicker() : '') +
renderReceivableDetailModal() +
renderWarnConfirmModal() +
(state.clearMenuOpen ? renderClearModal() : '') +
(state.weekPickerOpen ? renderWeekPickerModal() : '') +
(state.toast ? renderToast() : '');
bindEvents();
if (state.showSettings) renderSettingsContent();
startDragSort();
}

function renderHeader() {
return '<div class="top-header">' +
'<button class="avatar-btn">' + MANAGER.initials + '</button>' +
'<div class="greeting-block">' +
'<div class="greeting-hi">' + MANAGER.fullName + ' 👋</div>' +
'<div class="greeting-sub"><span class="live-dot"></span>' + data.settings.storeName + '</div>' +
'</div>' +
'<button class="icon-btn add-staff" id="addStaffBtn">＋</button>' +
'<button class="icon-btn ' + (state.showSettings ? 'settings-active' : '') + '" id="settingsBtn">⚙️</button>' +
'</div>';
}
function renderDateTimeBar() {
return '<div class="datetime-bar"><span>' + fmtDateTR(state.now) + '</span><span class="dt-sep">•</span><span class="dt-clock">' + fmtTime(state.now) + '</span></div>';
}

function renderHourTargetCard() {
const monthOffset = state.selectedMonthOffset || 0;
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const targetDate = getMonthByOffset(monthOffset);
const monthTarget = getMonthTarget(monthOffset);
const mb = getMonthWeekBuckets(monthOffset);
const buckets = mb.buckets, daysInMonth = mb.daysInMonth;
const monthUsed = getTotalMonthHoursForMonth(monthOffset);
const monthRemaining = monthTarget > 0 ? (monthTarget - monthUsed) : 0;
const oran = monthTarget > 0 ? (monthRemaining / monthTarget) * 100 : 0;
let oranCls = 'neutral';
if (monthTarget > 0) {
if (oran >= 50) oranCls = 'good';
else if (oran >= 20) oranCls = 'warn';
else oranCls = 'bad';
}
const isEditing = state.editingHourTarget;
const hasTarget = monthTarget > 0;
let targetDisplay;
if (isEditing) {
targetDisplay = '<input class="ht-input" id="hourTargetInput" type="tel" inputmode="numeric" value="' + (monthTarget || '') + '" placeholder="0" />';
} else {
targetDisplay = '<span class="ht-value ' + (hasTarget ? '' : 'empty') + '" id="hourTargetDisplay">' + (hasTarget ? monthTarget : '—') + '</span>';
}
const weekLineHtml = buckets.map(function(b){
let label;
if (b.isExtra) label = 'Kalan ' + b.days + ' Gün';
else if (b.isPartial) label = '1. Hafta (' + b.days + 'g)';
else label = b.index + '. Hafta';
const hours = monthTarget > 0 ? Math.round(monthTarget * (b.days / daysInMonth)) : 0;
return '<span class="htw-item"><span class="htw-lbl">' + label + '</span><span class="htw-val ' + (b.isExtra ? 'extra' : '') + '">' + hours + '</span></span>';
}).join('<span class="htw-sep">·</span>');

let monthPickerHtml = '';
if (state.showMonthPicker) {
const items = [];
for (let i = 0; i < 12; i++) {
const offset = -i;
const d = new Date(new Date().getFullYear(), new Date().getMonth() + offset, 1);
const isActive = offset === monthOffset;
items.push('<div class="month-picker-item ' + (isActive ? 'active' : '') + '" data-month-offset="' + offset + '">' +
'<span>' + AY[d.getMonth()] + ' ' + d.getFullYear() + '</span>' +
(isActive ? '<span class="mp-badge">Aktif</span>' : '') +
'</div>');
}
monthPickerHtml = '<div class="month-picker">' + items.join('') + '</div>';
}

return '<div class="hour-target-card">' +
'<div class="hour-target-head ' + (state.showMonthPicker ? 'open' : '') + '">' +
'<div class="hour-target-title">🎯 SAAT HEDEFİ</div>' +
'<button class="hour-target-toggle" id="monthPickerToggle">▼</button>' +
'</div>' +
monthPickerHtml +
'<div class="hour-target-nav">' +
'<button class="ht-nav-arrow" data-ht-month-shift="-1">‹</button>' +
'<div class="ht-nav-label" id="htNavLabel"><span class="ht-month">' + AY[targetDate.getMonth()].toUpperCase() + ' ' + targetDate.getFullYear() + '</span></div>' +
'<button class="ht-nav-arrow" data-ht-month-shift="1">›</button>' +
'</div>' +
'<div class="hour-target-compact">' +
'<div class="ht-value-wrap">' + targetDisplay +
(!isEditing ? '<div class="ht-hint">' + (hasTarget ? 'çift tıkla' : 'çift tıkla → hedef gir') + '</div>' : '') +
'</div>' +
'<div class="ht-meta">' +
'<div class="ht-chip"><div class="htc-lbl">Kullanılan</div><div class="htc-val ' + (monthUsed > 0 ? '' : 'empty') + '">' + (monthUsed > 0 ? monthUsed.toFixed(0) : '—') + '</div></div>' +
'<div class="ht-chip"><div class="htc-lbl">Kalan</div><div class="htc-val ' + (monthTarget > 0 ? oranCls : 'empty') + '">' + (monthTarget > 0 ? monthRemaining.toFixed(0) : '—') + '</div></div>' +
'<div class="ht-chip"><div class="htc-lbl">Gerçekleşen</div><div class="htc-val ' + (monthTarget > 0 ? oranCls : 'empty') + '">' + (monthTarget > 0 ? '%' + oran.toFixed(0) : '—') + '</div></div>' +
'</div>' +
'</div>' +
'<div class="hour-target-weeks">' + weekLineHtml + '</div>' +
'</div>';
}

function renderWeeklyHoursCard() {
const items = data.settings.staff.map(function(s){
const hours = getStaffWeekHours(s.id);
const limit = s.role === 'pt' ? (data.settings.ptMaxWeeklyHours || 30) : (data.settings.weeklyLimitHours || 45);
const cls = getWeekHoursColorClass(hours, limit);
const isEditingName = state.editingStaffNameId === s.id;
let nameHtml;
if (isEditingName) nameHtml = '<input class="wh-name-input" id="staffNameInlineInput" type="text" value="' + s.name + '" />';
else nameHtml = '<span class="wh-name" data-staff-name-cell="' + s.id + '">' + shortName(s.name) + '</span>';
return '<div class="wh-item" data-wh-staff="' + s.id + '">' + nameHtml + '<span class="wh-hours ' + cls + '">' + hours.toFixed(1) + '</span></div>';
}).join('');
return '<div class="weekly-hours-card">' +
'<div class="card-header" style="padding: 8px 14px 4px; display:flex; align-items:center; justify-content:space-between;">' +
'<div class="card-title" style="font-size: 11px;">👥 Haftalık Çalışma</div>' +
'<span style="font-size:10px;font-weight:800;color:#94a3b8;">basılı tut → sırala</span>' +
'</div>' +
'<div class="weekly-hours-scroll" id="weeklyHoursScroll">' + items + '</div>' +
'</div>';
}

function renderReceivableCard() {
const monthOffset = state.selectedMonthOffset || 0;
const items = data.settings.staff.map(function(s){
const net = getNetReceivableHours(s.id, monthOffset);
const hasHours = Math.abs(net) > 0.01;
const isEditingName = state.editingStaffNameId === s.id;
const isEditingHours = state.editingReceivableStaffId === s.id;
let nameHtml;
if (isEditingName) nameHtml = '<input class="wh-name-input" id="staffNameInlineInput" type="text" value="' + s.name + '" />';
else nameHtml = '<span class="wh-name" data-staff-name-cell="' + s.id + '">' + shortName(s.name) + '</span>';
const cls = net > 0.01 ? 'receivable' : (net < -0.01 ? 'danger' : 'zero');
let hoursHtml;
if (isEditingHours) hoursHtml = '<input class="wh-hours-input" id="manualExtraInput" type="tel" inputmode="decimal" value="' + fmtNetHoursShort(net) + '" />';
else hoursHtml = '<span class="wh-hours ' + cls + '" data-receivable-hours-cell="' + s.id + '">' + fmtNetHoursShort(net) + '</span>';
return '<div class="wh-item" data-receivable-staff="' + s.id + '" style="cursor:' + (hasHours ? 'pointer' : 'default') + ';">' + nameHtml + hoursHtml + '</div>';
}).join('');
return '<div class="weekly-hours-card">' +
'<div class="card-header" style="padding: 8px 14px 4px; display:flex; align-items:center; justify-content:space-between;">' +
'<div class="card-title" style="font-size: 11px;">💰 Alacak Saatler</div>' +
'<span style="font-size:10px;font-weight:800;color:#94a3b8;">çift tıkla → düzenle</span>' +
'</div>' +
'<div class="weekly-hours-scroll">' + items + '</div>' +
'</div>';
}

function renderReceivableDetailModal() {
const sid = state.receivableDetailStaffId;
if (!sid) return '';
const staff = data.settings.staff.find(function(s){return s.id === sid;});
if (!staff) return '';
const monthOffset = state.selectedMonthOffset || 0;
const earned = getWeeklyExtraDetails(sid, monthOffset);
const manual = getManualExtra(sid, monthOffset);
const used = getReceivableUsageDetails(sid, monthOffset);
const net = (earned.total + manual) - used.total;
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const target = getMonthByOffset(monthOffset);
const monthLabel = AY[target.getMonth()] + ' ' + target.getFullYear();
let earnedRows;
if (earned.weeks.length === 0) earnedRows = '<div style="font-size:12px;color:#94a3b8;font-weight:700;padding:4px 0;">Bu ay otomatik kazanılan alacak yok</div>';
else earnedRows = earned.weeks.map(function(w){
return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span style="font-size:13px;font-weight:800;color:#1e293b;">' + w.label + ' haftası</span><span style="font-size:13px;font-weight:900;color:#16a34a;">+' + fmtNetHoursShort(w.over) + ' sa</span></div>';
}).join('');
const manualRow = manual > 0 ? '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span style="font-size:13px;font-weight:800;color:#1e293b;">Manuel eklenen</span><span style="font-size:13px;font-weight:900;color:#16a34a;">+' + fmtNetHoursShort(manual) + ' sa</span></div>' : '';
let usedRows;
if (used.uses.length === 0) usedRows = '<div style="font-size:12px;color:#94a3b8;font-weight:700;padding:4px 0;">Bu ay alacak kullanımı yok</div>';
else usedRows = used.uses.map(function(u){
const p = u.dateKey.split('-').map(Number);
const dt = new Date(p[0], p[1]-1, p[2]);
const GUN = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const AY_K = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;"><span style="font-size:13px;font-weight:800;color:#1e293b;">' + p[2] + ' ' + AY_K[p[1]-1] + ' ' + GUN[dt.getDay()] + '</span><span style="font-size:13px;font-weight:900;color:#dc2626;">−' + fmtNetHoursShort(u.hours) + ' sa</span></div>';
}).join('');
return '<div class="modal-backdrop" data-close-receivable-detail="1"><div class="modal" onclick="event.stopPropagation()" style="max-width:390px;">' +
'<div class="modal-icon">💰</div>' +
'<div class="modal-title">' + shortName(staff.name) + '</div>' +
'<div class="modal-desc">' + monthLabel + ' — Net alacak: <b>' + fmtNetHoursShort(net) + ' saat</b></div>' +
'<div style="font-size:11px;font-weight:900;color:#16a34a;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:6px;">Kazanılan (' + fmtNetHoursShort(earned.total + manual) + ' sa)</div>' +
'<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:4px 12px;margin-bottom:12px;">' + earnedRows + manualRow + '</div>' +
'<div style="font-size:11px;font-weight:900;color:#dc2626;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:6px;">Kullanılan (' + fmtNetHoursShort(used.total) + ' sa)</div>' +
'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:4px 12px;">' + usedRows + '</div>' +
'<div class="modal-actions"><button class="modal-btn cancel" data-close-receivable-detail="1" style="width:100%;">Kapat</button></div>' +
'</div></div>';
}

function renderWarnConfirmModal() {
if (!state.warnConfirm) return '';
const errs = state.warnConfirm.errors.map(function(e){

function renderWeekPlan() {
const weekDates = getCurrentWeekDates();
const start = weekDates[0], end = weekDates[6];
const AY_KISA = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const today = new Date();
const todayMon = (function(){
const d = new Date(today); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day;
d.setDate(d.getDate() + diff); d.setHours(0,0,0,0); return d;
})();
const anchor = new Date(state.weekAnchorDate); anchor.setHours(0,0,0,0);
const diffWeeks = Math.round((anchor - todayMon) / (7 * 24 * 60 * 60 * 1000));
let label = '';
if (diffWeeks === 0) label = 'Bu Hafta';
else if (diffWeeks === 1) label = 'Gelecek Hafta';
else if (diffWeeks === -1) label = 'Geçen Hafta';
else if (diffWeeks > 1) label = diffWeeks + ' Hafta Sonra';
else label = Math.abs(diffWeeks) + ' Hafta Önce';
const startStr = start.getDate() + ' ' + AY_KISA[start.getMonth()];
const endStr = end.getDate() + ' ' + AY_KISA[end.getMonth()] + ' ' + end.getFullYear();
return '<div class="card">' +
'<div class="plan-header-row">' +
'<div class="plan-header-title">📅 HAFTALIK VARDIYA PLANI</div>' +
'<button class="clear-btn" id="openClearBtn">🗑️ Sıfırla</button>' +
'</div>' +
'<div class="plan-week-nav">' +
'<button class="plan-week-arrow" data-week-shift="-1">‹</button>' +
'<div class="plan-week-label" id="openWeekPicker">' +
'<span class="plan-week-cal">📅</span>' +
'<div class="plan-week-text"><span class="pwt-month">' + label + '</span><span class="pwt-range"> · ' + startStr + ' – ' + endStr + '</span></div>' +
'</div>' +
'<button class="plan-week-arrow" data-week-shift="1">›</button>' +
'</div>' +
renderPlanGrid() +
'</div>';
}

function renderWarnings() {

Object.entries(data.weekPlan).forEach(function(entry){

}
});
});
validatePTWeek().forEach(function(w){
warnings.push({ text: w.staff + ' PT haftalık ' + w.hours.toFixed(1) + ' — max ' + w.max + ' saat aşıldı!', danger: true, staffId: w.staffId, dateKey: null });

const now = Date.now();
if (now - lastTap < 350) { ev.preventDefault(); ev.stopPropagation(); state.editingStaffNameId = e.dataset.staffNameCell; render(); lastTap = 0; }
else { lastTap = now; }
});
});
const nameInp = el('staffNameInlineInput');
if (nameInp) {
setTimeout(function(){ nameInp.focus(); nameInp.select(); }, 30);
const commit = function(){
const val = nameInp.value.trim();
const sid = state.editingStaffNameId;
if (sid && val) {
const st = data.settings.staff.find(function(s){return s.id === sid;});
if (st) st.name = val;
lsSave();
}
state.editingStaffNameId = null;
render();
};
nameInp.addEventListener('keydown', function(ev){
if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
if (ev.key === 'Escape') { state.editingStaffNameId = null; render(); }
});
nameInp.addEventListener('blur', commit);
}
document.querySelectorAll('[data-receivable-staff]').forEach(function(e){
e.onclick = function(ev){
if (ev.target.closest('[data-staff-name-cell]') || ev.target.closest('input') || ev.target.closest('[data-receivable-hours-cell]')) return;
const sid = e.dataset.receivableStaff;
const earned = getExtraHours(sid, state.selectedMonthOffset || 0);
const used = getUsedReceivableHours(sid, state.selectedMonthOffset || 0);
if (earned <= 0.01 && used <= 0.01) return;
state.receivableDetailStaffId = sid;
render();
};
});
document.querySelectorAll('[data-close-receivable-detail]').forEach(function(e){ e.onclick = function(){ state.receivableDetailStaffId = null; render(); }; });
document.querySelectorAll('[data-warn-edit]').forEach(function(e){ e.onclick = function(){ state.warnConfirm = null; render(); }; });
document.querySelectorAll('[data-warn-apply]').forEach(function(e){ e.onclick = function(){ autoSaveShift(true); }; });
if (state.showSettings) renderSettingsContent();
}

// ============ BAŞLAT ============
render();
initFirebase();

setInterval(function(){
state.now = new Date();
const c = document.querySelector('.dt-clock');
if (c) c.textContent = fmtTime(state.now);
}, 30000);
</script>
</body>
</html>

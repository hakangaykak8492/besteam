.plan-header-title { font-size: 11.5px; font-weight: 900; color: #1e293b; letter-spacing: 1px;
text-transform: uppercase; }
.clear-btn { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 900; cursor: pointer; }
.plan-week-nav { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px 10px; }
.plan-week-arrow { width: 32px; height: 32px; border-radius: 8px; background: #ffffff; border: 1px solid #e2e8f0; color: #475569; font-size: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.plan-week-label { display: flex; align-items: center; gap: 6px; padding: 6px 12px;

.plan-corner { background: #ffffff; border-right: 2px solid #64748b; border-bottom: 2px solid #64748b; padding: 0; min-height: 34px; cursor: pointer; }
.plan-corner-inner { width: 24px; height: 24px; border-radius: 8px; background: #fce7f3;

.plan-corner:active .plan-corner-inner { background: #fbcfe8; transform: scale(0.92); }
.plan-day-head { background: #f1f5f9; border-right: 1px solid #cbd5e1; border-bottom: 2px solid #64748b; display: flex; flex-direction: column; align-items: center; justify-content:

.plan-day-head .pdh-num { font-size: 8px; font-weight: 700; color: #94a3b8; }
.plan-name-cell { background: #fafbfc; border-right: 2px solid #64748b; border-bottom: 1px solid #64748b; display: flex; flex-direction: column; align-items: center; justify-content:

.plan-name-cell .pnc-name { font-size: 9px; font-weight: 900; color: #0f172a; white-space: normal; word-break: break-word; line-height: 1.05; max-width: 100%; text-align: center;
overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.plan-name-cell .pnc-role { font-size: 8px; font-weight: 900; color: #64748b; white-space: nowrap; letter-spacing: 0.3px; }
.pnc-name-input { font-size: 9.5px; font-weight: 900; color: #0f172a; background: #eff6ff;
border: 1.5px solid #3b82f6; border-radius: 4px; outline: none; text-align: center; padding: 1px 2px; width: 96%; }
.plan-cell { border-right: 1px solid #cbd5e1; border-bottom: 1px solid #64748b; cursor:
pointer; position: relative; display: flex; flex-direction: column; align-items: center;
justify-content: center; padding: 4px 0; min-height: 62px; gap: 0; font-size: 11px; font-weight: 900; line-height: 1.15; color: #0f172a; min-width: 0; }
.plan-cell.sabah { background: #ffedd5; color: #9a3412; }
.plan-cell.aksam { background: #e0e7ff; color: #3730a3; }
.plan-cell.tam { background: #fce7f3; color: #9d174d; }
.plan-cell.izinli { background: #d1fae5; color: #065f46; font-size: 9.5px; }
.plan-cell.alacak-izinli { background: #ede9fe; color: #6b21a8; font-size: 9px; }
.plan-cell.pt-off { background: #e2e8f0; color: #334155; font-size: 9.5px; }
.plan-cell.gece { background: #ede9fe; color: #5b21b6; }
.plan-cell.has-error { animation: cellErrorPulse 1.4s ease-in-out infinite; }
@keyframes cellErrorPulse { 0%, 100% { background: #fef2f2; box-shadow: inset 0 0 0 2px rgba(220,38,38,0.5); } 50% { background: #fecaca; box-shadow: inset 0 0 0 3px #dc2626, 0 0 8px rgba(220,38,38,0.5); } }
.plan-cell .pc-time { font-size: 10.5px; font-weight: 900; line-height: 1.15; white-space:
nowrap; position: relative; z-index: 1; }
.plan-cell .pc-divider { width: 72%; height: 1px; background: rgba(0,0,0,0.22); margin: 2.5px auto; border-radius: 1px; }
.plan-cell .pc-meta { display: flex; align-items: center; justify-content: center; gap: 4px;
line-height: 1; width: 100%; }
.plan-cell .pc-net { font-size: 9.5px; font-weight: 800; color: #64748b; }
.plan-cell .pc-break-sep { font-size: 9px; font-weight: 800; color: #94a3b8; }
.plan-cell .pc-break { font-size: 9.5px; font-weight: 800; color: #64748b; }
.plan-cell.has-error .pc-net, .plan-cell.has-error .pc-break, .plan-cell.has-error .pc-break-sep {

.plan-cell .pc-ar { position: absolute; top: 2px; right: 3px; font-size: 9px; font-weight: 900;

.plan-sum-label { background: #f1f5f9; border-right: 2px solid #64748b; border-top: 1px solid #64748b; font-size: 8.5px; font-weight: 900; color: #7c3aed; text-transform: uppercase;
padding-left: 2px; min-height: 28px; }
.plan-sum-cell { background: #faf5ff; border-right: 1px solid #cbd5e1; border-top: 1px solid #64748b; font-size: 11px; font-weight: 900; color: #7c3aed; min-height: 28px; }
.plan-count-label { background: #f1f5f9; border-right: 2px solid #64748b; border-top: 1px solid #64748b; font-size: 8.5px; font-weight: 900; color: #475569; text-transform: uppercase;

.plan-count-cell { background: #f8fafc; border-right: 1px solid #cbd5e1; border-top: 1px solid #64748b; font-size: 11px; font-weight: 900; color: #0f172a; min-height: 26px; padding: 2px 1px; }

.warnings-card { padding: 0 14px 12px; }
.warning-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;

.warning-empty { font-size: 13px; color: #16a34a; font-weight: 800; padding: 10px;
background: #f0fdf4; border-radius: 8px; text-align: center; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 100;
display: flex; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; }
.modal { background: #ffffff; border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; max-height: 92vh; overflow-y: auto; margin: auto; }
.modal-icon { width: 52px; height: 52px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px; }
.modal-title { font-size: 17px; font-weight: 800; color: #0f172a; text-align: center;

.modal-desc { font-size: 13px; color: #64748b; font-weight: 600; text-align: center;

.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 15px;

.modal-btn.cancel { background: #f1f5f9; color: #475569; }
.modal-btn.confirm { background: #2563eb; color: #ffffff; }
.modal-btn.danger { background: #dc2626; color: #ffffff; }
.modal-scroll-body { overflow-y: auto; }

.shift-modal { background: #ffffff; border-radius: 14px; width: 100%; max-width: 440px;
min-height: 540px; max-height: 96vh; overflow: hidden; margin: auto; display: flex;

.shift-modal-head { padding: 10px 50px 8px 50px; border-bottom: 1px solid #e2e8f0;

padding: 0; }
.shift-modal-delete { position: absolute; top: 10px; left: 10px; width: 34px; height: 34px;

padding: 0; }
.shift-chips-bar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid
#e2e8f0; overflow-x: auto; flex-shrink: 0; justify-content: flex-start; }

/* ============ KART BUTONU (chip bar) ============ */
.stc-btn { flex-shrink: 0; width: 88px; height: 88px; padding: 4px; border: 2px solid #e2e8f0;
background: #ffffff; border-radius: 12px; color: #475569; cursor: pointer; display: flex;
flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden;
}
.stc-btn .stc-media { width: 44px; height: 44px; display: flex; align-items: center;

.stc-btn .stc-media img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.stc-btn .stc-label { font-size: 10px; font-weight: 900; text-align: center; line-height: 1.1;
max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.stc-btn.active { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
.stc-btn.izinli.active { border-color: #16a34a; background: #dcfce7; color: #166534; }
.stc-btn.alacak-izinli.active { border-color: #9333ea; background: #ede9fe; color: #6b21a8; }
.stc-btn.pt-off.active { border-color: #64748b; background: #e2e8f0; color: #334155; }

.stc-btn-add { border-style: dashed; background: #f8fafc; color: #64748b; }
.stc-btn-add .stc-media { font-size: 28px; color: #64748b; }
.stc-btn-add:hover { border-color: #3b82f6; color: #2563eb; background: #eff6ff; }

.shift-modal-body { overflow-y: auto; flex: 1; padding-bottom: 12px; }

const RECEIVABLE_LEAVE_HOURS = 7.5;
const PT_OFF_TYPE = 'pt-off';

const CHIP_TYPE_DEFAULTS = {
'izinli': '#d1fae5',
[RECEIVABLE_LEAVE_TYPE]: '#ede9fe',
[PT_OFF_TYPE]: '#e2e8f0'
};
const CHIP_TYPE_LABELS = {
'time': 'Saat Seç',
'full': 'Tam Gün',
'izinli': 'Haftalık İzin',
[RECEIVABLE_LEAVE_TYPE]: 'Alacak İzni',
[PT_OFF_TYPE]: 'PT Çalışma Yok'
};

// SABİT RENKLER (fallback — kullanıcı override edebilir)
const DEFAULT_STAFF_COLORS = {
manager:   { bg: '#fce7f3', text: '#9d174d' },
assistant: { bg: '#d1fae5', text: '#065f46' },
ft:        { bg: '#dbeafe', text: '#1e40af' },

// YASAL MOLA KURALLARI (varsayılan — kullanıcı düzenleyebilir)
const DEFAULT_BREAK_RULES = [
{ minHours: 0,   maxHours: 4,   breakMin: 15  },
{ minHours: 4,   maxHours: 7.5, breakMin: 30  },
{ minHours: 7.5, maxHours: 11,  breakMin: 60  },
{ minHours: 11,  maxHours: 14,  breakMin: 120 }
];

// Boş başlangıç — demo personel veya plan yazılmaz
const DEFAULT_SETTINGS = {
storeName: '',
setupComplete: false,
weeklyLimitHours: 45,
dailyLimitHours: 11,
nightLimitHours: 7.5,
ptMaxWeeklyHours: 30,
monthlyTargetsByMonth: {},
shiftChips: [],
colorRules: [],
roleRules: [],
breakRules: JSON.parse(JSON.stringify(DEFAULT_BREAK_RULES)),

// ============ STATE ============

settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
weekPlan: {},
manualExtra: {}
};

let _dirty = false;

monthPickerMonth: _tmonday.getMonth(),
selectedMonthOffset: 0,
editingStaffNameId: null,

alacakToggleOn: false,

clearMenuOpen: false,
clearSelectedStaff: [],

};

// ============ YARDIMCI FONKSİYONLAR ============
function dateKey(d) {
return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
String(d.getDate()).padStart(2,'0');
}
function monthKey(d) {
return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function fmtTime(d) {
return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtTimeSec(d) {
return String(d.getHours()).padStart(2,'0') + ':' +
       String(d.getMinutes()).padStart(2,'0') + ':' +
       String(d.getSeconds()).padStart(2,'0');
}
function fmtDateTR(d) {
const AY =
['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'] ;
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
return d.getDate() + ' ' + AY[d.getMonth()] + ' ' + d.getFullYear() + ', ' + GUN[d.getDay()];
}
function initials(name) {
if (!name) return '?';
return name.trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
}
function shortName(fullName) { return fullName || ''; }
function autoShortTitle(title) {
if (!title) return '';
const words = title.trim().split(/\s+/).filter(Boolean);
if (words.length === 0) return '';
return words.map(function(w){ return w.charAt(0).toLocaleUpperCase('tr-TR');
}).join('').slice(0, 4);
}
function roleLabelFor(staff) {
if (!staff) return '';
if (staff.titleShort && staff.titleShort.trim()) return staff.titleShort.trim();
if (ROLES[staff.role] && ROLES[staff.role].short) return ROLES[staff.role].short;
return autoShortTitle(staff.title || '');
}
function getWeekDatesForDate(date) {
const d = new Date(date);
const day = d.getDay();
const diff = day === 0 ? -6 : 1 - day;
const monday = new Date(d);
monday.setDate(d.getDate() + diff);
monday.setHours(0,0,0,0);
const arr = [];
for (let i = 0; i < 7; i++) { const x = new Date(monday); x.setDate(monday.getDate() + i);
arr.push(x); }
return arr;
}
function getCurrentWeekDates() { return getWeekDatesForDate(state.weekAnchorDate); }
function toMin(hhmm) { if (!hhmm) return 0; const p = hhmm.split(':'); return parseInt(p[0],10) * 60 + (parseInt(p[1],10) || 0); }
function isLeaveType(t) { return t === 'izinli' || t === RECEIVABLE_LEAVE_TYPE || t === PT_OFF_TYPE; }
function shiftDurationMin(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
if (!shift.start || !shift.end) return 0;
return (toMin(shift.end) - toMin(shift.start) + 1440) % 1440;
}
function shiftHours(shift) { return shiftDurationMin(shift) / 60; }
function getAutoBreak(grossHours) {
const rules = (data.settings.breakRules || []).slice().sort(function(a,b){return a.minHours - b.minHours;});
if (!rules.length) return 0;
for (let i = 0; i < rules.length; i++) {
const r = rules[i];
const min = typeof r.minHours === 'number' ? r.minHours : 0;
const max = typeof r.maxHours === 'number' ? r.maxHours : Infinity;
const last = i === rules.length - 1;
if (grossHours >= min && (grossHours < max || (grossHours === max && !last) || (last && grossHours >= min))) {
if (grossHours === max && !last) continue;
return r.breakMin;
}
}
return rules[rules.length-1].breakMin;
}
function shiftNetHours(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
const grossH = shiftHours(shift);
if (grossH <= 0) return 0;
const net = Math.max(0, grossH - getAutoBreak(grossH) / 60);
const used = shiftAlacakHours(shift);
return Math.max(0, net - used);
}
function shiftAlacakHours(shift) {
if (!shift || isLeaveType(shift.type)) return 0;
return parseFloat(shift.alacakHours) || 0;
}
function fmtNetHoursShort(hours) {
if (!hours || hours <= 0) return '0';
const r = Math.round(hours * 100) / 100;
if (Math.abs(r - Math.round(r)) < 0.01) return String(Math.round(r));
let s = r.toFixed(2);
s = s.replace(/0+$/, '');
s = s.replace(/\.$/, '');
s = s.replace('.', ',');

}

for (let i = 0; i < dur; i++) { const cur = (s + i) % 1440; if (cur >= 20*60 || cur < 6*60)
nightMin++;}
return nightMin > dur / 2;
}

}
function isValidHex(h) {

function getShiftColor(start, end) {
if (!start || !end) return null;
const sMin = toMin(start);
const dur = (toMin(end) - sMin + 1440) % 1440;
const midNorm = (sMin + Math.floor(dur / 2)) % 1440;
const rules = (data.settings.colorRules || []).filter(function(r){ return r.enabled !== false && !r.chipType; });
for (let i = 0; i < rules.length; i++) {
const r = rules[i];
const rs = toMin(r.start); const re = toMin(r.end);
if (rs < re) { if (midNorm >= rs && midNorm < re) return r.color; }

return null;
}
function getChipTypeColor(shiftType) {
if (!shiftType) return null;
const rules = data.settings.colorRules || [];

}
function chipVisibleForStaff(chip, staff) {
const aud = chip.audience || 'all';
if (aud === 'all') return true;
if (!staff) return true;
if (aud === 'pt') return staff.role === 'pt';
if (aud === 'ft') return staff.role !== 'pt';
return true;
}

// ============ DOĞRULAMA ============
function validateShift(shift) {
const errors = [];
if (!shift || isLeaveType(shift.type)) return errors;
if (!shift.start || !shift.end) { errors.push('Başlangıç ve bitiş saati zorunlu'); return errors; }
if (shift.start === shift.end) { errors.push('Giriş ve çıkış aynı olamaz'); return errors; }
const dailyLimit = data.settings.dailyLimitHours || 11;
const nightLimit = data.settings.nightLimitHours || 7.5;
const grossH = shiftHours(shift);
const netH = Math.max(0, grossH - getAutoBreak(grossH) / 60);
if (netH > dailyLimit + 0.001) errors.push('Günlük ' + dailyLimit + ' saat sınırı aşılıyor (net ' + netH.toFixed(1) + ' sa)');
if (isNightShift(shift.start, shift.end) && netH > nightLimit + 0.001) errors.push('Gece çalışması ' + nightLimit + ' saati aşamaz (net ' + netH.toFixed(1) + ' sa)');
if (shiftAlacakHours(shift) > netH + 0.001) errors.push('Alacak kullanımı vardiya net süresinden büyük');
return errors;
}
function getStaffWeekHours(staffId) {
if (!staffId) return 0;
let totalH = 0;
getCurrentWeekDates().forEach(function(d){
const s = (data.weekPlan[dateKey(d)] || {})[staffId];
if (s && s.type && !isLeaveType(s.type)) totalH += shiftNetHours(s);
});
return totalH;
}
function validatePTWeek() {
const warnings = [];
data.settings.staff.filter(function(s){return s.role === 'pt';}).forEach(function(s){
const h = getStaffWeekHours(s.id);
const max = data.settings.ptMaxWeeklyHours || 30;
if (h > max) warnings.push({ staff: s.name, hours: h, max: max, staffId: s.id });
});
return warnings;
}
function getDayTotalHours(dk) {
let total = 0;
Object.values(data.weekPlan[dk] || {}).forEach(function(s){
if (s && s.type && !isLeaveType(s.type)) total += shiftNetHours(s);
});
return total;
}
function getDayCounts(dk) {
let total = 0;
Object.values(data.weekPlan[dk] || {}).forEach(function(s){
if (s && s.type && !isLeaveType(s.type)) total++;
});
return { total: total };
}

// ============ AY / HAFTA ============
function getMonthByOffset(monthOffset) {
const now = new Date();
return new Date(now.getFullYear(), now.getMonth() + (monthOffset || 0), 1);
}
function getMonthTarget(monthOffset) {
const mk = monthKey(getMonthByOffset(monthOffset));
const map = data.settings.monthlyTargetsByMonth || {};
return typeof map[mk] === 'number' ? map[mk] : 0;
}
function setMonthTarget(monthOffset, value) {
const mk = monthKey(getMonthByOffset(monthOffset));
if (!data.settings.monthlyTargetsByMonth) data.settings.monthlyTargetsByMonth = {};
if (!value) delete data.settings.monthlyTargetsByMonth[mk];
else data.settings.monthlyTargetsByMonth[mk] = value;
lsSave();
}
function getTotalMonthHoursForMonth(monthOffset) {
const mPrefix = monthKey(getMonthByOffset(monthOffset));
const list = data.settings.staff || [];
let totalH = 0;
Object.entries(data.weekPlan || {}).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
if (dk.indexOf(mPrefix) !== 0) return;
list.forEach(function(s){
const sh = (dayPlan || {})[s.id];
if (sh && sh.type && !isLeaveType(sh.type)) totalH += shiftNetHours(sh);
});
});
return totalH;
}
function getMonthWeekBuckets(monthOffset) {
const first = getMonthByOffset(monthOffset);
const year = first.getFullYear(), month = first.getMonth();
const daysInMonth = new Date(year, month + 1, 0).getDate();
const buckets = [];
const firstDay = first.getDay();
const firstDayMB = firstDay === 0 ? 7 : firstDay;
let currentDay = 1, weekNum = 1;
const firstWeekDays = firstDayMB === 1 ? 7 : (8 - firstDayMB);
const firstWeekEnd = Math.min(firstWeekDays, daysInMonth);
buckets.push({ index: weekNum, startDay: 1, endDay: firstWeekEnd, days: firstWeekEnd, isExtra: false, isPartial: firstDayMB !== 1 });
currentDay = firstWeekEnd + 1; weekNum++;
while (currentDay + 6 <= daysInMonth) {
buckets.push({ index: weekNum, startDay: currentDay, endDay: currentDay + 6, days: 7, isExtra: false, isPartial: false });
currentDay += 7; weekNum++;
}
if (currentDay <= daysInMonth) {
const rem = daysInMonth - currentDay + 1;
buckets.push({ index: weekNum, startDay: currentDay, endDay: daysInMonth, days: rem, isExtra: true, isPartial: false });
}
return { buckets: buckets, daysInMonth: daysInMonth };
}
function getFirstMondayOfMonth(monthOffset) {
const first = getMonthByOffset(monthOffset);
const day = first.getDay();
const firstDayMB = day === 0 ? 7 : day;
const monday = new Date(first);
if (firstDayMB === 1) return monday;
monday.setDate(first.getDate() + (8 - firstDayMB));
monday.setHours(0,0,0,0);
return monday;
}
function getWeeksInMonth(year, month) {
const first = new Date(year, month, 1);
const daysInMonth = new Date(year, month + 1, 0).getDate();
const firstDayMB = first.getDay() === 0 ? 7 : first.getDay();
const weeks = [];
let mon = new Date(first);
mon.setDate(first.getDate() - (firstDayMB - 1));
mon.setHours(0,0,0,0);
const endOfMonth = new Date(year, month, daysInMonth);
while (mon <= endOfMonth) {
const end = new Date(mon);
end.setDate(mon.getDate() + 6);
weeks.push({ start: new Date(mon), end: end });
mon = new Date(mon);
mon.setDate(mon.getDate() + 7);
}
return weeks;
}

// ============ ALACAK ============
function getManualExtra(staffId, monthOffset) {
const mk = monthKey(getMonthByOffset(monthOffset));
return (data.manualExtra[staffId] || {})[mk] || 0;
}
function setManualExtra(staffId, monthOffset, hours) {
const mk = monthKey(getMonthByOffset(monthOffset));
if (!data.manualExtra[staffId]) data.manualExtra[staffId] = {};
if (!hours) delete data.manualExtra[staffId][mk];
else data.manualExtra[staffId][mk] = hours;
lsSave();
}
function getWeeklyExtraDetails(staffId, monthOffset) {
const so = data.settings.staff.find(function(s){return s.id === staffId;});
if (!so || (so.role !== 'ft' && so.role !== 'manager' && so.role !== 'assistant')) return { total: 0, weeks: [] };
const weeklyLimit = data.settings.weeklyLimitHours || 45;
const mPrefix = monthKey(getMonthByOffset(monthOffset));
const weekMap = {};
const dayCount = {};
Object.entries(data.weekPlan || {}).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
const sh = (dayPlan || {})[staffId];
if (!sh || !sh.type || isLeaveType(sh.type)) return;
const p = dk.split('-').map(Number);
const dt = new Date(p[0], p[1]-1, p[2]);
const day = dt.getDay();
const diff = day === 0 ? -6 : 1 - day;
const mon = new Date(dt);
mon.setDate(dt.getDate() + diff);
const wk = dateKey(mon);
weekMap[wk] = (weekMap[wk] || 0) + shiftNetHours(sh);
if (!dayCount[wk]) dayCount[wk] = {};
const mk = dk.slice(0, 7);
dayCount[wk][mk] = (dayCount[wk][mk] || 0) + 1;
});
const weeks = [];
Object.entries(weekMap).forEach(function(entry){
const wk = entry[0]; const hours = entry[1];
let best = ''; let bestN = -1;
Object.entries(dayCount[wk] || {}).forEach(function(e){ if (e[1] > bestN) { bestN = e[1]; best = e[0]; } });
if (best !== mPrefix) return;
const over = hours - weeklyLimit;
if (over > 0.01) {
const p = wk.split('-').map(Number);
const mon = new Date(p[0], p[1]-1, p[2]);
const sun = new Date(mon);
sun.setDate(mon.getDate() + 6);
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
weeks.push({ weekKey: wk, label: mon.getDate() + ' ' + AY[mon.getMonth()] + ' – ' + sun.getDate() + ' ' + AY[sun.getMonth()], over: over, total: hours });
}
});
weeks.sort(function(a,b){return a.weekKey.localeCompare(b.weekKey);});
let totalOver = 0;
weeks.forEach(function(w){totalOver += w.over;});
return { total: totalOver, weeks: weeks };
}
function getReceivableUsageDetails(staffId, monthOffset) {
const mPrefix = monthKey(getMonthByOffset(monthOffset));
const uses = [];
Object.entries(data.weekPlan || {}).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
if (dk.indexOf(mPrefix) !== 0) return;
const sh = (dayPlan || {})[staffId];
if (!sh) return;
if (sh.type === RECEIVABLE_LEAVE_TYPE) uses.push({ dateKey: dk, hours:
RECEIVABLE_LEAVE_HOURS });
else if (!isLeaveType(sh.type) && shiftAlacakHours(sh) > 0) uses.push({ dateKey: dk, hours: shiftAlacakHours(sh) });
});
uses.sort(function(a,b){return a.dateKey.localeCompare(b.dateKey);});
let total = 0;
uses.forEach(function(u){total += u.hours;});
return { total: total, uses: uses };
}
function getExtraHours(staffId, monthOffset) {
return getWeeklyExtraDetails(staffId, monthOffset).total + getManualExtra(staffId,
monthOffset);
}
function getUsedReceivableHours(staffId, monthOffset) { return
getReceivableUsageDetails(staffId, monthOffset).total; }
function getNetReceivableHours(staffId, monthOffset) { return getExtraHours(staffId,
monthOffset) - getUsedReceivableHours(staffId, monthOffset); }
function getAvailableReceivableForWeek(staffId) {
let offset = state.selectedMonthOffset || 0;
if (state.modal && state.modal.dateKey) {
const p = state.modal.dateKey.split('-').map(Number);
const now = new Date();
offset = (p[0] - now.getFullYear()) * 12 + ((p[1] - 1) - now.getMonth());
}
const earned = getExtraHours(staffId, offset);
const used = getUsedReceivableHours(staffId, offset);
return Math.max(0, earned - used);
}

// ============ TELEFON / EMAIL ============
function formatPhoneMask(raw) {
const d = String(raw || '').replace(/\D/g, '').slice(0, 10);
let out = '';
if (d.length > 0) out += d.slice(0, 3);
if (d.length > 3) out += ' ' + d.slice(3, 6);
if (d.length > 6) out += ' ' + d.slice(6, 8);
if (d.length > 8) out += ' ' + d.slice(8, 10);
return out;
}
function phoneDigitsFromStored(stored) {
if (!stored) return '';
let d = String(stored).replace(/\D/g, '');
if (d.length > 10 && d.indexOf('90') === 0) d = d.slice(2);
return formatPhoneMask(d);
}
function normalizePhoneForSave(raw) {
const d = String(raw || '').replace(/\D/g, '').slice(0, 10);
if (d.length !== 10) return '';
return '+90 ' + formatPhoneMask(d);
}
function isValidEmail(email) {
if (!email) return true;
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
function isValidPhone(raw) {
if (!raw) return true;
const d = String(raw).replace(/\D/g, '');
return d.length === 10 && d.charAt(0) === '5';
}

// ============ FIREBASE ============
let _fbReady = false;
let _saveTimer = null;
let _applyingRemote = false;
const FB_DOC_PATH = ['shared', 'state'];

function initFirebase() {
const fb = window.__fb;
if (!fb) { setTimeout(initFirebase, 100); return; }
fb.signInAnonymously(fb.auth).catch(function(err){ console.error('Anonim giriş hatası:', err);
});
fb.onAuthStateChanged(fb.auth, function(user){
if (!user) return;
_fbReady = true;
fbSubscribe();
});
}

async function fbSubscribe() {
const fb = window.__fb;
const ref = fb.doc(fb.db, FB_DOC_PATH[0], FB_DOC_PATH[1]);
try {
const snap = await fb.getDoc(ref);
if (snap.exists()) {
const remote = snap.data();
applyRemote(remote, false);
_dataLoaded = true;
} else {
startSetup();
return;
}
} catch (e) {
console.error('İlk okuma hatası:', e);
_dataLoaded = true;
render();
return;
}
fb.onSnapshot(ref, function(s){
if (!s.exists()) return;
if (s.metadata.hasPendingWrites) return;
applyRemote(s.data(), true);
}, function(err){ console.error('Snapshot hatası:', err); });
render();
}

function applyRemote(remote, isUpdate) {
if (_dirty && isUpdate) return;
_applyingRemote = true;
data.settings = Object.assign({}, DEFAULT_SETTINGS, remote.settings || {});
if (remote.settings) {
if (remote.settings.shiftChips) {
data.settings.shiftChips = remote.settings.shiftChips.map(function(c){
var o = Object.assign({}, c);
if (typeof o.audience !== 'string') o.audience = o.ptOnly ? 'pt' : 'all';
delete o.ptOnly;
if (typeof o.image === 'undefined') o.image = null;
if (typeof o.icon === 'undefined') o.icon = '⭐';
return o;
});
}
if (remote.settings.colorRules) data.settings.colorRules = remote.settings.colorRules;
if (remote.settings.roleRules) data.settings.roleRules = remote.settings.roleRules;
if (remote.settings.breakRules) data.settings.breakRules = remote.settings.breakRules;
if (remote.settings.staff) data.settings.staff = remote.settings.staff;
if (remote.settings.monthlyTargetsByMonth) data.settings.monthlyTargetsByMonth =
remote.settings.monthlyTargetsByMonth;
}
// Migration: colorRules id/enabled
(data.settings.colorRules || []).forEach(function(r, i){
if (!r.id) r.id = 'cr_migrated_' + i;
if (typeof r.enabled !== 'boolean') r.enabled = true;
});
data.weekPlan = remote.weekPlan || {};
data.manualExtra = remote.manualExtra || {};
_applyingRemote = false;
if (isUpdate && !state.modal && !state.showSettings && !state.clearMenuOpen &&
!state.weekPickerOpen && !state.showSetup) {
render();
}
}

async function fbSaveNow() {
const fb = window.__fb;
if (!fb || !_fbReady) return;
setSyncBadge('saving');
try {
await fb.setDoc(fb.doc(fb.db, FB_DOC_PATH[0], FB_DOC_PATH[1]), {
settings: data.settings,
weekPlan: data.weekPlan,
manualExtra: data.manualExtra,
updatedAt: Date.now()
});
_dirty = false;
setSyncBadge('online');
} catch (e) {
console.error('Kayıt hatası:', e);
setSyncBadge('offline');
}
}

function lsSave() {
if (_applyingRemote) return;
_dirty = true;
clearTimeout(_saveTimer);
_saveTimer = setTimeout(function(){ if (_fbReady) fbSaveNow(); }, 400);
}

function setSyncBadge(mode) {
const el = document.getElementById('syncBadge');
if (!el) return;
el.className = 'sync-badge ' + mode;
if (mode === 'online') el.innerHTML = '<span class="dot"></span> CANLI';
else if (mode === 'saving') el.innerHTML = '<span class="dot"></span> KAYDEDİLİYOR';
else el.innerHTML = '<span class="dot"></span> OFFLINE';
}

// ============ SÜRÜKLE-BIRAK SIRALAMA ============
function startDragSort() {
const container = document.getElementById('weeklyHoursScroll');
if (!container) return;
const items = Array.from(container.querySelectorAll('[data-wh-staff]'));
if (items.length < 2) return;
let dragIdx = -1;
let dragged = null;

const onDown = function(e, item, idx) {
if (e.target.closest('[data-staff-name-cell]')) return;
dragged = item;
dragIdx = idx;
item.classList.add('dragging');
};
const onUp = function(e) {
if (!dragged) return;
const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
let targetIdx = -1;
let side = 'right';
items.forEach(function(it, idx){
const r = it.getBoundingClientRect();
if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
targetIdx = idx;
side = x < r.left + r.width / 2 ? 'left' : 'right';
}
});
if (targetIdx >= 0 && targetIdx !== dragIdx) {
const staffList = data.settings.staff;
const movedId = items[dragIdx].dataset.whStaff;
const fromIdx = staffList.findIndex(function(s){return s.id === movedId;});
if (fromIdx >= 0) {
const moved = staffList.splice(fromIdx, 1)[0];
const targetId = items[targetIdx].dataset.whStaff;
let toIdx = staffList.findIndex(function(s){return s.id === targetId;});
if (toIdx < 0) toIdx = staffList.length;
else if (side === 'right') toIdx = toIdx + 1;
staffList.splice(toIdx, 0, moved);
lsSave();
showToast('↕  Sıralama kaydedildi', 'info');
}
}
items.forEach(function(it){ it.classList.remove('dragging'); });
dragged = null;
dragIdx = -1;
render();
};

items.forEach(function(item, idx){
let pressTimer = null;
let isDragging = false;
const startPress = function(e) {
if (e.target.closest('input')) return;
pressTimer = setTimeout(function(){
isDragging = true;
if (navigator.vibrate) navigator.vibrate(15);
onDown(e, item, idx);
}, 220);
};
const cancelPress = function(e) {
if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
if (isDragging) { onUp(e); isDragging = false; }
};
item.addEventListener('touchstart', function(e){ startPress(e); }, { passive: true });
item.addEventListener('touchmove', function(e){ if (isDragging) { e.preventDefault(); } }, {
passive: false });
item.addEventListener('touchend', function(e){ cancelPress(e); });
item.addEventListener('mousedown', function(e){ e.preventDefault(); startPress(e); });
item.addEventListener('mouseup', function(e){ cancelPress(e); });
});
}

// ============ VARDİYA DÜZENLEME ============
function openShiftEdit(staffId, dk) {
const cur = (data.weekPlan[dk] || {})[staffId] || null;
state.modal = { type: 'shiftEdit', staffId: staffId, dateKey: dk, activeChipId: null,
startHour: null, startMinute: null, endHour: null, endMinute: null,
existing: cur, step: 'start-hour' };
state.alacakToggleOn = false;
state.alacakHours = 3;
if (cur && !isLeaveType(cur.type)) {
if (cur.start) { const p = cur.start.split(':'); state.modal.startHour = parseInt(p[0],10);
state.modal.startMinute = parseInt(p[1],10); }
if (cur.end) { const p = cur.end.split(':'); state.modal.endHour = parseInt(p[0],10);
state.modal.endMinute = parseInt(p[1],10); }
if (shiftAlacakHours(cur) > 0) { state.alacakToggleOn = true; state.alacakHours =
shiftAlacakHours(cur); }
}
render();
}
function autoSaveShift(force) {
const m = state.modal; if (!m) return;
if (m.startHour === null || m.startMinute === null || m.endHour === null || m.endMinute === null) return;
const startStr = String(m.startHour).padStart(2,'0') + ':' +
String(m.startMinute).padStart(2,'0');
const endStr = String(m.endHour).padStart(2,'0') + ':' + String(m.endMinute).padStart(2,'0');
const durH = ((toMin(endStr) - toMin(startStr) + 1440) % 1440) / 60;
let type = 'sabah';
if (durH >= 10) type = 'tam';
else if (isNightShift(startStr, endStr)) type = 'gece';
else if (toMin(startStr) >= 12 * 60) type = 'aksam';
const mData = { type: type, start: startStr, end: endStr };
if (state.alacakToggleOn && state.alacakHours > 0) mData.alacakHours =
state.alacakHours;
const errors = validateShift(mData);
if (errors.length > 0 && !force) {
state.warnConfirm = { mData: mData, dateKey: m.dateKey, staffId: m.staffId, errors: errors };
render(); return;
}
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = mData;
lsSave();
state.modal = null; state.warnConfirm = null;
showToast('✅ ' + startStr + ' - ' + endStr, 'success');
render();
}
function saveShiftAsIzinli() {
const m = state.modal; if (!m) return;
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: 'izinli', start: '', end: '' };
lsSave(); state.modal = null;
showToast('🏖 Haftalık izin kaydedildi', 'success'); render();
}
function saveShiftAsPTOff() {
const m = state.modal; if (!m) return;
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: PT_OFF_TYPE, start: '', end: '' };
lsSave(); state.modal = null;
showToast('📅 Çalışma yok kaydedildi', 'success'); render();
}
function saveShiftAsAlacakIzinli() {
const m = state.modal; if (!m) return;
const avail = getAvailableReceivableForWeek(m.staffId);
if (avail < RECEIVABLE_LEAVE_HOURS) { showToast('Yetersiz alacak', 'error'); return; }
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = { type: RECEIVABLE_LEAVE_TYPE, start: '', end: '' };
lsSave(); state.modal = null;
showToast('💰 Alacak izni (7,5 sa)', 'success'); render();
}
function saveShiftAsFull(chip) {

const start = chip.start || '10:00';
const end = chip.end || '22:00';
const mData = { type: 'full', start: start, end: end };
const errors = validateShift(mData);
if (errors.length > 0) {
state.warnConfirm = { mData: mData, dateKey: m.dateKey, staffId: m.staffId, errors: errors };

}
if (!data.weekPlan[m.dateKey]) data.weekPlan[m.dateKey] = {};
data.weekPlan[m.dateKey][m.staffId] = mData;

showToast('✅ ' + chip.name + ' kaydedildi', 'success'); render();
}
function deleteShiftEdit() {
const m = state.modal; if (!m) return;
if (data.weekPlan[m.dateKey]) {
delete data.weekPlan[m.dateKey][m.staffId];
if (Object.keys(data.weekPlan[m.dateKey]).length === 0) delete data.weekPlan[m.dateKey];
}
lsSave(); state.modal = null;
showToast('🗑 Vardiya silindi', 'info'); render();
}
function selectChip(chipId) {
const m = state.modal; if (!m) return;
const chip = data.settings.shiftChips.find(function(c){return c.id === chipId;});
if (!chip) return;
if (chip.type === 'full') { saveShiftAsFull(chip); return; }
if (chip.type === 'izinli') {
const staff = data.settings.staff.find(function(s){return s.id === m.staffId;});
if (staff && staff.role === 'pt') { saveShiftAsPTOff(); return; }
saveShiftAsIzinli(); return;
}
if (chip.type === PT_OFF_TYPE) { saveShiftAsPTOff(); return; }
if (chip.type === RECEIVABLE_LEAVE_TYPE) {
const avail = getAvailableReceivableForWeek(m.staffId);
if (avail < RECEIVABLE_LEAVE_HOURS) { showToast('Yetersiz alacak', 'error'); return; }
saveShiftAsAlacakIzinli(); return;
}
// time tipi
m.activeChipId = chipId;
m.step = 'start-hour';
render();
}
function pickHour(which, hour) {

function saveProfile() {
const p = state.editingProfile;
if (!p) return;
if (!p.name || !p.name.trim()) { showToast('❌ İsim gerekli', 'error'); return; }
const email = (p.email || '').trim();
const phoneRaw = (p.phone || '').trim();
const phoneDigits = phoneRaw.replace(/\D/g, '');
if (email && !isValidEmail(email)) {
const errEl = document.getElementById('emailErr');
const inp = document.getElementById('profEmail');
if (errEl) errEl.classList.add('show');
if (inp) inp.classList.add('invalid');
showToast('❌ Geçersiz e-posta adresi', 'error');
return;
}
if (phoneDigits.length > 0) {
if (phoneDigits.length !== 10 || phoneDigits.charAt(0) !== '5') {
const grp = document.getElementById('phoneGroup');
const errEl = document.getElementById('phoneErr');
if (grp) grp.classList.add('invalid');
if (errEl) errEl.classList.add('show');
showToast('❌ Telefon 10 hane olmalı ve 5 ile başlamalı', 'error');
return;
}
}
const phoneStored = phoneDigits.length === 10 ? normalizePhoneForSave(phoneDigits) : '';
const idx = data.settings.staff.findIndex(function(s){return s.id === p.id;});
if (idx >= 0) {
const old = data.settings.staff[idx];
data.settings.staff[idx] = Object.assign({}, old, {
name: p.name.trim(),
title: (p.title || '').trim() || (ROLES[old.role] && ROLES[old.role].label) || 'Personel',
email: email,
phone: phoneStored,
avatar: p.avatar || null
});
}
lsSave();
state.modal = null;
state.editingProfile = null;
showToast('✅ Profil kaydedildi', 'success');
render();
}
function pickProfileAvatar() {
const input = document.createElement('input');
input.type = 'file';
input.accept = 'image/*';
input.setAttribute('capture', 'user');
input.onchange = function(e) {
const file = e.target.files && e.target.files[0];
if (!file) return;
resizeImage(file, 256, function(dataUrl) {
if (state.editingProfile) {
state.editingProfile.avatar = dataUrl;
render();
}
});
};
input.click();
}
function resizeImage(file, maxSize, cb) {
const reader = new FileReader();
reader.onload = function(e) {
const img = new Image();
img.onload = function() {
let w = img.width, h = img.height;
if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
cb(canvas.toDataURL('image/jpeg', 0.82));
};
img.onerror = function() { showToast('Resim yüklenemedi', 'error'); };
img.src = e.target.result;
};
reader.readAsDataURL(file);
}

const today = new Date();
const offset = (state.monthPickerYear - today.getFullYear()) * 12 + (monthIdx -
today.getMonth());
state.selectedMonthOffset = offset;
state.monthPickerModalOpen = false;
if (offset === 0) {
const day = today.getDay();
const diff = day === 0 ? -6 : 1 - day;
const mon = new Date(today);
mon.setDate(today.getDate() + diff);
mon.setHours(0,0,0,0);
state.weekAnchorDate = mon;
} else {
state.weekAnchorDate = getFirstMondayOfMonth(offset);
}
render();
}

DEFAULT_STAFF_COLORS.pt);

// ============ PICKR ============
let pickrRegistry = {};
function destroyPickrs() {
Object.keys(pickrRegistry).forEach(function(k){
try { pickrRegistry[k].destroyAndRemove(); } catch(e){}
});
pickrRegistry = {};
}
function makePickr(elId, initialColor, onChange) {
if (typeof Pickr === 'undefined') return null;
if (pickrRegistry[elId]) {
try { pickrRegistry[elId].destroyAndRemove(); } catch(e){}
delete pickrRegistry[elId];
}
const el = document.getElementById(elId);
if (!el) return null;
const safeColor = (initialColor && isValidHex(initialColor)) ? initialColor : '#e0e7ff';
const pickr = Pickr.create({
el: '#' + elId,
useAsButton: true,
theme: 'classic',
default: safeColor,
swatches: [
'#ffedd5', '#e0e7ff', '#fce7f3', '#ede9fe', '#d1fae5',
'#dbeafe', '#f3e8ff', '#fed7aa', '#fee2e2', '#dcfce7',
'#fef3c7', '#e2e8f0', '#cbd5e1', '#94a3b8'
],
components: {
preview: true, opacity: false, hue: true,
interaction: { hex: true, rgba: false, hsla: false, input: true, save: true }
}
});
el.style.background = safeColor;
el.style.color = getReadableText(safeColor);
pickr.on('change', function(color){
const hex = color.toHEXA().toString();
el.style.background = hex;
el.style.color = getReadableText(hex);
onChange(hex);
});
pickr.on('save', function(color){
const hex = color.toHEXA().toString();
el.style.background = hex;
el.style.color = getReadableText(hex);
onChange(hex);
pickr.hide();
});
pickrRegistry[elId] = pickr;
return pickr;
}

<script>

function render() {

bindSetupEvents();

}

}
app.innerHTML =
'<div class="sync-badge ' + (_fbReady ? 'online' : 'saving') + '" id="syncBadge"><span class="dot"></span> ' + (_fbReady ? 'CANLI' : 'BAĞLANIYOR') + '</div>' +
renderHeader() +
renderDateTimeBar() +
renderHourTargetCard() +
renderWeeklyHoursCard() +
renderWeekPlan() +
renderReceivableCard() +
renderWarnings() +
renderFooter() +
(state.showSettings ? renderSettingsPage() : '') +
(state.modal && state.modal.type === 'shiftEdit' ? renderShiftEditModal() : '') +
(state.modal && state.modal.type === 'staffManager' ? renderStaffManagerModal() : '') + (state.modal && state.modal.type === 'staffForm' ? renderStaffFormModal() : '') +
(state.modal && state.modal.type === 'profile' ? renderProfileModal() : '') +
(state.emojiPickerFor ? renderEmojiPickerModal() : '') +
renderReceivableDetailModal() +
renderWarnConfirmModal() +
(state.clearMenuOpen ? renderClearModal() : '') +
(state.weekPickerOpen ? renderWeekPickerModal() : '') +

(state.toast ? renderToast() : '');

function renderSetupScreen() {

'</div>';

return '<div class="setup-page"><div class="setup-wrap">' +
'<div class="setup-hero">' +
'<div class="setup-logo">📅</div>' +

staffRows +

'</div>' +

(mgr.avatar ? '<img src="' + mgr.avatar + '" alt="" />' : mgr.initials) +
'</button>' +

'</span></div>';

function renderHourTargetCard() {
const monthOffset = state.selectedMonthOffset || 0;
const AY =
['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'] ;
const targetDate = getMonthByOffset(monthOffset);
const monthTarget = getMonthTarget(monthOffset);
const mb = getMonthWeekBuckets(monthOffset);
const buckets = mb.buckets, daysInMonth = mb.daysInMonth;
const monthUsed = getTotalMonthHoursForMonth(monthOffset);
const monthRemaining = monthTarget > 0 ? (monthTarget - monthUsed) : 0;
const oran = monthTarget > 0 ? (monthRemaining / monthTarget) * 100 : 0;
const realized = monthTarget > 0 ? (monthUsed / monthTarget) * 100 : 0;
let oranCls = 'neutral';
if (monthTarget > 0) {
if (oran >= 50) oranCls = 'good';
else if (oran >= 20) oranCls = 'warn';
else oranCls = 'bad';
}
const isEditing = state.editingHourTarget;
const hasTarget = monthTarget > 0;
let targetDisplay;
if (isEditing) targetDisplay = '<input class="ht-input" id="hourTargetInput" type="tel" inputmode="numeric" value="' + (monthTarget || '') + '" placeholder="0" />';
else targetDisplay = '<span class="ht-value ' + (hasTarget ? '' : 'empty') + '" id="hourTargetDisplay">' + (hasTarget ? monthTarget : '—') + '</span>';
const weekLineHtml = buckets.map(function(b){
let label;
if (b.isExtra) label = 'Kalan ' + b.days + ' Gün';
else if (b.isPartial) label = '1. Hafta (' + b.days + 'g)';
else label = b.index + '. Hafta';
const rawHours = buckets.map(function(x){ return monthTarget > 0 ? monthTarget * (x.days / daysInMonth) : 0; });
const floorHours = rawHours.map(function(n){ return Math.floor(n); });
let leftHours = (monthTarget > 0 ? Math.round(monthTarget) : 0) - floorHours.reduce(function(a,b){return a+b;}, 0);
const hourOrder = rawHours.map(function(n, idx){ return { idx: idx, frac: n - floorHours[idx] }; }).sort(function(a,b){ return b.frac - a.frac; });
for (let hi = 0; hi < hourOrder.length && leftHours > 0; hi++, leftHours--) floorHours[hourOrder[hi].idx] += 1;
const hours = floorHours[buckets.indexOf(b)];
return '<span class="htw-item"><span class="htw-lbl">' + label + '</span><span class="htw-val ' + (b.isExtra ? 'extra' : '') + '">' + hours + '</span></span>';
}).join('<span class="htw-sep">·</span>');

return '<div class="hour-target-card">' +
'<div class="hour-target-head">' +
'<div class="hour-target-title">🎯 SAAT HEDEFİ</div>' +
'</div>' +
'<div class="hour-target-nav">' +
'<button class="ht-nav-arrow" data-ht-month-shift="-1">‹</button>' +
'<div class="ht-nav-label" id="openMonthPicker"><span class="ht-month">' +
AY[targetDate.getMonth()].toUpperCase() + ' ' + targetDate.getFullYear() + '</span> 📅</div>' +
'<button class="ht-nav-arrow" data-ht-month-shift="1">›</button>' +
'</div>' +
'<div class="hour-target-compact">' +
'<div class="ht-value-wrap">' + targetDisplay +
(!isEditing ? '<div class="ht-hint">' + (hasTarget ? 'çift tıkla' : 'çift tıkla → hedef gir') + '</div>' : '') +
'</div>' +
'<div class="ht-meta">' +
'<div class="ht-chip"><div class="htc-lbl">Kullanılan</div><div class="htc-val ' + (monthUsed > 0 ? '' : 'empty') + '">' + (monthUsed > 0 ? monthUsed.toFixed(0) : '—') + '</div></div>' + '<div class="ht-chip"><div class="htc-lbl">Kalan</div><div class="htc-val ' + (monthTarget > 0 ? oranCls : 'empty') + '">' + (monthTarget > 0 ? monthRemaining.toFixed(0) : '—') +
'</div></div>' +
'<div class="ht-chip"><div class="htc-lbl">Gerçekleşen</div><div class="htc-val ' +
(monthTarget > 0 ? oranCls : 'empty') + '">' + (monthTarget > 0 ? '%' + realized.toFixed(0) : '—') + '</div></div>' +
'</div>' +
'</div>' +
'<div class="hour-target-weeks">' + weekLineHtml + '</div>' +
'</div>';
}

function renderWeeklyHoursCard() {

function renderWeekPlan() {
const weekDates = getCurrentWeekDates();
const start = weekDates[0], end = weekDates[6];
const AY_KISA = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const today = new Date();
const todayMon = (function(){
const d = new Date(today); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day;
d.setDate(d.getDate() + diff); d.setHours(0,0,0,0); return d;
})();
const anchor = new Date(state.weekAnchorDate); anchor.setHours(0,0,0,0);
const diffWeeks = Math.round((anchor - todayMon) / (7 * 24 * 60 * 60 * 1000));
let label = '';
if (diffWeeks === 0) label = 'Bu Hafta';
else if (diffWeeks === 1) label = 'Gelecek Hafta';
else if (diffWeeks === -1) label = 'Geçen Hafta';
else if (diffWeeks > 1) label = diffWeeks + ' Hafta Sonra';
else label = Math.abs(diffWeeks) + ' Hafta Önce';
const startStr = start.getDate() + ' ' + AY_KISA[start.getMonth()];
const endStr = end.getDate() + ' ' + AY_KISA[end.getMonth()] + ' ' + end.getFullYear();
return '<div class="card">' +
'<div class="plan-header-row">' +
'<div class="plan-header-title">📅 HAFTALIK VARDIYA PLANI</div>' +
'<button class="clear-btn" id="openClearBtn">🗑 Sıfırla</button>' +
'</div>' +
'<div class="plan-week-nav">' +
'<button class="plan-week-arrow" data-week-shift="-1">‹</button>' +
'<div class="plan-week-label" id="openWeekPicker">' +
'<span class="plan-week-cal">📅</span>' +
'<div class="plan-week-text"><span class="pwt-month">' + label + '</span><span class="pwt-range"> · ' + startStr + ' – ' + endStr + '</span></div>' +
'</div>' +
'<button class="plan-week-arrow" data-week-shift="1">›</button>' +
'</div>' +
renderPlanGrid() +
'</div>';
}

function renderWarnings() {
const warnings = [];
const weekDates = getCurrentWeekDates();
const dkSet = {};
weekDates.forEach(function(d){ dkSet[dateKey(d)] = true; });
Object.entries(data.weekPlan).forEach(function(entry){
const dk = entry[0]; const dayPlan = entry[1];
if (!dkSet[dk]) return;
Object.entries(dayPlan).forEach(function(e2){
const staffId = e2[0]; const s = e2[1];
if (!s || isLeaveType(s.type)) return;
const errs = validateShift(s);
if (errs.length > 0) {
const staff = data.settings.staff.find(function(x){return x.id === staffId;});
errs.forEach(function(err){
warnings.push({ text: (staff ? staff.name : staffId) + ': ' + err, danger: true, staffId: staffId,
dateKey: dk });
});
}
});
});
validatePTWeek().forEach(function(w){
warnings.push({ text: w.staff + ' PT haftalık ' + w.hours.toFixed(1) + ' — max ' + w.max + ' saat aşıldı!', danger: true, staffId: w.staffId, dateKey: null });

function renderAlacakToggle(avail) {

}

});

state.editingHourTarget = true; render(); });

targetDisplay.addEventListener('touchend', function(ev){

if (now - lastTap < 350) { ev.preventDefault(); state.editingHourTarget = true; render();
lastTap = 0; }
else { lastTap = now; }

e.dataset.receivableHoursCell; render(); };
let lastTap = 0;
e.addEventListener('touchend', function(ev){
const now = Date.now();
if (now - lastTap < 350) { ev.preventDefault(); ev.stopPropagation();
state.editingReceivableStaffId = e.dataset.receivableHoursCell; render(); lastTap = 0; }
else { lastTap = now; }

mInp.addEventListener('blur', commit);

selectChip(e.dataset.chipId); }; });

});
document.querySelectorAll('[data-go-save-manual]').forEach(function(e){

m.endMinute = parseInt(p[1],10); }
autoSaveShift(false);

state.editingProfile = null;
render();
};
});
document.querySelectorAll('[data-modal-delete]').forEach(function(e){ e.onclick =
deleteShiftEdit; });
document.querySelectorAll('[data-toggle-alacak]').forEach(function(e){ e.onclick =
toggleAlacak; });
document.querySelectorAll('[data-alacak-quick]').forEach(function(e){

setAlacakHours(parseFloat(e.dataset.alacakQuick)); };
});
document.querySelectorAll('[data-open-chip-settings]').forEach(function(e){
e.onclick = function(ev){
ev.stopPropagation();
state.modal = null;
state.showSettings = true;
state.editingSettings = JSON.parse(JSON.stringify(data.settings));
state.settingsTab = 'chips';
state.expandedChipId = null;
render();
};
});

// ---- Emoji Picker Modal ----
document.querySelectorAll('[data-close-emoji-picker]').forEach(function(e){
e.onclick = function(){ state.emojiPickerFor = null; render(); };
});
if (state.emojiPickerFor) {
setTimeout(function(){
const picker = document.getElementById('chipEmojiPicker');
if (picker) {
picker.addEventListener('emoji-click', function(ev){
const target = state.emojiPickerFor;
const s = state.editingSettings;
if (!s) return;
if (target && target.type === 'chip') {
const chip = s.shiftChips[target.index];
if (chip) {
chip.icon = ev.detail.unicode;
chip.image = null;
}
}
state.emojiPickerFor = null;
render();
}, { once: true });
}
}, 100);
}

// ---- Personel yönetimi ----
document.querySelectorAll('[data-edit-staff]').forEach(function(e){ e.onclick = function(){
openStaffForm(e.dataset.editStaff); }; });

deleteStaff(e.dataset.delStaff); }; });

openStaffForm(); };

const roleSelEl = el('staffRoleSelect');
if (roleSelEl) {
roleSelEl.onchange = function(){
const newRole = roleSelEl.value;
if (state.editingStaff) {
state.editingStaff.role = newRole;
state.editingStaff.title = (ROLES[newRole] && ROLES[newRole].label) || 'Personel';
state.editingStaff.titleShort = (ROLES[newRole] && ROLES[newRole].short) || '';
}
};
}
const saveStaffBtn = el('saveStaffFormBtn');
if (saveStaffBtn) saveStaffBtn.onclick = function(){
const nameEl = el('staffNameInput');
const roleEl = el('staffRoleSelect');
if (nameEl) state.editingStaff.name = nameEl.value.trim();
if (roleEl) state.editingStaff.role = roleEl.value;
saveStaffForm();
};

// ---- Profil ----
const avatarPick = el('profileAvatarPick');
if (avatarPick) avatarPick.onclick = pickProfileAvatar;
const profName = el('profName');
if (profName) profName.addEventListener('input', function(e){ if (state.editingProfile)
state.editingProfile.name = e.target.value; });
const profTitle = el('profTitle');
if (profTitle) profTitle.addEventListener('input', function(e){ if (state.editingProfile)
state.editingProfile.title = e.target.value; });

if (profEmail) {
profEmail.addEventListener('input', function(e){
const val = e.target.value;
if (state.editingProfile) state.editingProfile.email = val;
const invalid = val.length > 0 && !isValidEmail(val);
e.target.classList.toggle('invalid', invalid);
const errEl = el('emailErr');
if (errEl) errEl.classList.toggle('show', invalid);
});
profEmail.addEventListener('blur', function(){
const val = profEmail.value.trim();
if (state.editingProfile) state.editingProfile.email = val;
});
}
const profPhone = el('profPhone');
if (profPhone) {
profPhone.addEventListener('input', function(e){
const cursorAtEnd = e.target.selectionStart === e.target.value.length;
const masked = formatPhoneMask(e.target.value);
e.target.value = masked;
if (cursorAtEnd) e.target.setSelectionRange(masked.length, masked.length);
if (state.editingProfile) state.editingProfile.phone = masked;
const grp = el('phoneGroup');
const errEl = el('phoneErr');
const digits = masked.replace(/\D/g, '');
const invalid = digits.length > 0 && (digits.length !== 10 || digits.charAt(0) !== '5');
if (grp) grp.classList.toggle('invalid', invalid);
if (errEl) errEl.classList.toggle('show', invalid);
});
profPhone.addEventListener('blur', function(){
if (state.editingProfile) state.editingProfile.phone = formatPhoneMask(profPhone.value);
});
}
const saveProfBtn = el('saveProfileBtn'); if (saveProfBtn) saveProfBtn.onclick = saveProfile;

e.addEventListener('touchend', function(ev){

if (st) st.name = val;
lsSave();
}
state.editingStaffNameId = null;
render();
};
nameInp.addEventListener('keydown', function(ev){

nameInp.addEventListener('blur', commit);
}

document.querySelectorAll('[data-receivable-staff]').forEach(function(e){

});

};

ev.stopPropagation();
const idx = parseInt(el.dataset.chipToggle || el.dataset.chipToggleBtn, 10);
const chip = s.shiftChips[idx];
if (!chip) return;
state.expandedChipId = (state.expandedChipId === chip.id) ? null : chip.id;
renderSettingsContent();
};
});

// Name
document.querySelectorAll('[data-chip-name]').forEach(function(el){
el.oninput = function(){

if (s.shiftChips[idx]) s.shiftChips[idx].name = el.value;
};
});

// Delete
document.querySelectorAll('[data-chip-del]').forEach(function(el){
el.onclick = function(ev){
ev.stopPropagation();
const idx = parseInt(el.dataset.chipDel, 10);
if (!s.shiftChips[idx]) return;
const chipId = s.shiftChips[idx].id;
s.shiftChips.splice(idx, 1);
if (state.expandedChipId === chipId) state.expandedChipId = null;
renderSettingsContent();
};
});

// Type change
document.querySelectorAll('[data-chip-type-set]').forEach(function(el){
el.onclick = function(ev){
ev.stopPropagation();
const idx = parseInt(el.dataset.chipTypeSet, 10);
const newType = el.dataset.typeVal;
if (!s.shiftChips[idx]) return;
s.shiftChips[idx].type = newType;
if (newType === 'full') {
s.shiftChips[idx].start = s.shiftChips[idx].start || '10:00';
s.shiftChips[idx].end = s.shiftChips[idx].end || '22:00';
} else {
s.shiftChips[idx].start = '';
s.shiftChips[idx].end = '';
}
if (newType !== 'full' && newType !== 'time') {
const hasRule = (s.colorRules || []).some(function(x){ return x.chipType === newType; });
if (!hasRule) {
s.colorRules.push({
id: 'cr_type_' + newType,
chipType: newType,
color: CHIP_TYPE_DEFAULTS[newType] || '#e2e8f0',
name: CHIP_TYPE_LABELS[newType] || newType,
enabled: true
});
}
}
renderSettingsContent();
};
});

document.querySelectorAll('[data-chip-end]').forEach(function(el){

function setChipImage(idx, dataUrl) {
const chip = s.shiftChips[idx];
if (chip) {
chip.image = dataUrl;
renderSettingsContent();
}
}
function pickChipImageFromSettings(idx, useCamera) {
const input = document.createElement('input');
input.type = 'file';
input.accept = 'image/*';
if (useCamera) input.setAttribute('capture', 'user');
input.onchange = function(ev) {
const file = ev.target.files && ev.target.files[0];
if (!file) return;
resizeImage(file, 256, function(dataUrl) { setChipImage(idx, dataUrl); });
};
input.click();
}
document.querySelectorAll('[data-chip-pick-camera]').forEach(function(el){
el.onclick = function(ev){ ev.stopPropagation();
pickChipImageFromSettings(parseInt(el.dataset.chipPickCamera, 10), true); };
});
document.querySelectorAll('[data-chip-pick-gallery]').forEach(function(el){
el.onclick = function(ev){ ev.stopPropagation();
pickChipImageFromSettings(parseInt(el.dataset.chipPickGallery, 10), false); };
});
document.querySelectorAll('[data-chip-pick-photo]').forEach(function(el){
el.onclick = function(ev){ ev.stopPropagation();
pickChipImageFromSettings(parseInt(el.dataset.chipPickPhoto, 10), false); };
});
document.querySelectorAll('[data-chip-pick-url]').forEach(function(el){
el.onclick = function(ev){
ev.stopPropagation();
const idx = parseInt(el.dataset.chipPickUrl, 10);
const url = prompt('Fotoğraf URL\'si girin:');
if (url && url.trim()) setChipImage(idx, url.trim());
};
});
document.querySelectorAll('[data-chip-remove-image]').forEach(function(el){
el.onclick = function(ev){
ev.stopPropagation();
const idx = parseInt(el.dataset.chipRemoveImage, 10);
if (s.shiftChips[idx]) { s.shiftChips[idx].image = null; renderSettingsContent(); }
};
});
document.querySelectorAll('[data-chip-pick-emoji]').forEach(function(el){
el.onclick = function(ev){
ev.stopPropagation();
const idx = parseInt(el.dataset.chipPickEmoji, 10);
state.emojiPickerFor = { type: 'chip', index: idx };
render();
};
});

// Pickr for chip colors
document.querySelectorAll('[data-chip-pickr]').forEach(function(swatch){
const idx = parseInt(swatch.dataset.chipPickr, 10);
const chip = s.shiftChips[idx];
if (!chip) return;
let rule = (s.colorRules || []).find(function(x){ return x.chipType === chip.type; });
if (!rule) return;
makePickr(swatch.id, rule.color, function(hex){
rule.color = hex;
swatch.style.background = hex;
const lbl = swatch.parentElement.querySelector('.chip-color-label');
if (lbl) lbl.textContent = hex.toUpperCase();
});
});

// Add chip
const addChip = document.getElementById('addChipBtn');
if (addChip) addChip.onclick = function(){
const newChip = {
id: 'chip_' + Date.now(),
icon: '⭐',
image: null,
name: 'Yeni Kart',
type: 'full',
start: '09:00',
end: '18:00',
audience: 'all'
};
s.shiftChips.push(newChip);
state.expandedChipId = newChip.id;
renderSettingsContent();
};

// Save chips
const saveChips = document.getElementById('saveChipsBtn');
if (saveChips) saveChips.onclick = function(){
data.settings.shiftChips = s.shiftChips.map(function(c){return Object.assign({}, c);});
const existingTypes = (data.settings.colorRules || []).filter(function(r){return
r.chipType;}).map(function(r){return r.chipType;});
data.settings.shiftChips.forEach(function(c){
if (c.type && c.type !== 'time' && c.type !== 'full' && existingTypes.indexOf(c.type) < 0) {
data.settings.colorRules.push({
id: 'cr_type_' + c.type,
chipType: c.type,
color: CHIP_TYPE_DEFAULTS[c.type] || '#e2e8f0',
name: CHIP_TYPE_LABELS[c.type] || c.name,
enabled: true
});
existingTypes.push(c.type);
}
});
lsSave();
showToast('✅ Kartlar kaydedildi', 'success');
render();
};

// ---------- COLORS ----------
document.querySelectorAll('[data-color-start]').forEach(function(el){
el.oninput = function(){ const idx = parseInt(el.dataset.colorStart, 10); if (s.colorRules[idx]) s.colorRules[idx].start = el.value; };
});
document.querySelectorAll('[data-color-end]').forEach(function(el){
el.oninput = function(){ const idx = parseInt(el.dataset.colorEnd, 10); if (s.colorRules[idx]) s.colorRules[idx].end = el.value; };
});
document.querySelectorAll('[data-color-name]').forEach(function(el){
el.oninput = function(){ const idx = parseInt(el.dataset.colorName, 10); if (s.colorRules[idx]) s.colorRules[idx].name = el.value; };
});
document.querySelectorAll('[data-color-del]').forEach(function(el){
el.onclick = function(){ s.colorRules.splice(parseInt(el.dataset.colorDel, 10), 1);
renderSettingsContent(); };
});
const addColor = document.getElementById('addColorRuleBtn');
if (addColor) addColor.onclick = function(){
s.colorRules.push({ id: 'cr_' + Date.now(), start: '12:00', end: '18:00', color: '#e0e7ff', name: 'Yeni', enabled: true });
renderSettingsContent();
};
document.querySelectorAll('[data-pickr-rule]').forEach(function(swatch){
const idx = parseInt(swatch.dataset.pickrRule, 10);
if (!s.colorRules[idx]) return;
makePickr(swatch.id, s.colorRules[idx].color, function(hex){
s.colorRules[idx].color = hex;
});
});
document.querySelectorAll('[data-pickr-role-bg]').forEach(function(swatch){
const roleKey = swatch.dataset.pickrRoleBg;
let rule = s.roleRules.find(function(r){return r.role === roleKey;});
if (!rule) {
rule = { role: roleKey, bg: DEFAULT_STAFF_COLORS[roleKey].bg, text:
DEFAULT_STAFF_COLORS[roleKey].text };
s.roleRules.push(rule);
}
makePickr(swatch.id, rule.bg, function(hex){
rule.bg = hex;
const block = swatch.closest('.role-color-block');
if (block) {
const avatar = block.querySelector('.role-color-avatar');
const mini = block.querySelector('.role-preview-mini');
if (avatar) { avatar.style.background = hex; avatar.style.color = rule.text; }
if (mini) { mini.style.background = hex; mini.style.color = rule.text; }
}
});
});
document.querySelectorAll('[data-pickr-role-text]').forEach(function(swatch){
const roleKey = swatch.dataset.pickrRoleText;
let rule = s.roleRules.find(function(r){return r.role === roleKey;});
if (!rule) {
rule = { role: roleKey, bg: DEFAULT_STAFF_COLORS[roleKey].bg, text:
DEFAULT_STAFF_COLORS[roleKey].text };
s.roleRules.push(rule);
}
makePickr(swatch.id, rule.text, function(hex){
rule.text = hex;
const block = swatch.closest('.role-color-block');
if (block) {
const avatar = block.querySelector('.role-color-avatar');
const mini = block.querySelector('.role-preview-mini');
if (avatar) avatar.style.color = hex;
if (mini) mini.style.color = hex;
}
});
});
const saveColors = document.getElementById('saveColorsBtn');
if (saveColors) saveColors.onclick = function(){
data.settings.colorRules = s.colorRules.map(function(c){return Object.assign({}, c);});
data.settings.roleRules = (s.roleRules || []).map(function(r){return Object.assign({}, r);});
data.settings.staff = s.staff.map(function(st){
return Object.assign({}, st, { color: st.color ? Object.assign({}, st.color) : undefined });
});
lsSave();
showToast('✅ Renkler kaydedildi', 'success');
render();
};

// ---------- BREAKS ----------
document.querySelectorAll('[data-break-min-h]').forEach(function(el){
el.oninput = function(){ s.breakRules[+el.dataset.breakMinH].minHours =
parseFloat(el.value.replace(',','.')) || 0; };
});
document.querySelectorAll('[data-break-max]').forEach(function(el){
el.oninput = function(){ s.breakRules[+el.dataset.breakMax].maxHours =
parseFloat(el.value.replace(',','.')) || 0; };
});
document.querySelectorAll('[data-break-min]').forEach(function(el){
el.oninput = function(){ s.breakRules[+el.dataset.breakMin].breakMin = parseInt(el.value) || 0; };
});
document.querySelectorAll('[data-break-del]').forEach(function(el){
el.onclick = function(){ s.breakRules.splice(+el.dataset.breakDel, 1);
renderSettingsContent(); };
});
const addBreak = document.getElementById('addBreakRuleBtn');
if (addBreak) addBreak.onclick = function(){
const last = s.breakRules[s.breakRules.length - 1] || { maxHours: 4, breakMin: 15 };
s.breakRules.push({ minHours: last.maxHours, maxHours: last.maxHours + 2, breakMin: last.breakMin + 30 });
renderSettingsContent();
};
const saveBreaks = document.getElementById('saveBreaksBtn');
if (saveBreaks) saveBreaks.onclick = function(){
data.settings.breakRules = s.breakRules.map(function(r){return Object.assign({}, r);});
lsSave();
showToast('✅ Molalar kaydedildi', 'success');
render();
};
}

// ============ RESPONSIVE / ROTATE ============
let _lastLayoutKey = (window.innerWidth || 0) + 'x' + (window.innerHeight || 0);
function handleResize() {
if (state.showSettings || state.modal || state.showSetup || !_dataLoaded) return;
const w = window.innerWidth || 0;
const h = window.innerHeight || 0;
const layoutKey = w + 'x' + h;
if (layoutKey === _lastLayoutKey) return;
_lastLayoutKey = layoutKey;
clearTimeout(window.__resizeTimer);
window.__resizeTimer = setTimeout(function(){
if (state.showSettings || state.modal || state.showSetup || !_dataLoaded) return;
render();
}, 180);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function(){
setTimeout(handleResize, 150);
setTimeout(handleResize, 400);
});

// ============ BOOT ============
render();
initFirebase();

setInterval(function(){
state.now = new Date();
const c = document.querySelector('.dt-clock');
if (c) c.textContent = fmtTimeSec(state.now);
}, 1000);
</script>
</body>
</html>

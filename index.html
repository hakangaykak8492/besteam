// ============ FIREBASE SENKRON ============
let _fbReady = false;
let _saveTimer = null;
let _applyingRemote = false;
const FB_DOC_PATH = ['shared', 'state'];

function initFirebase() {
const fb = window.__fb;
if (!fb) { setTimeout(initFirebase, 100); return; }
fb.signInAnonymously(fb.auth).catch(err => {
console.error('Anonim giriş hatası:', err);
});
fb.onAuthStateChanged(fb.auth, (user) => {
if (!user) return;
_fbReady = true;
fbSubscribe();
});
}

async function fbSubscribe() {
const fb = window.__fb;
const ref = fb.doc(fb.db, ...FB_DOC_PATH);
try {
const snap = await fb.getDoc(ref);
if (snap.exists()) {
applyRemote(snap.data(), false);
} else {
seedDemoWeekPlan();
await fbSaveNow();
}
} catch (e) {
console.error('İlk okuma hatası:', e);
render();
return;
}
fb.onSnapshot(ref, (s) => {
if (!s.exists()) return;
if (s.metadata.hasPendingWrites) return;
applyRemote(s.data(), true);
}, (err) => {
console.error('Snapshot hatası:', err);
});
render();
}

function applyRemote(remote, isUpdate) {
_applyingRemote = true;
data.settings = Object.assign({}, DEFAULT_SETTINGS, remote.settings || {});
if (remote.settings) {
if (remote.settings.shiftChips) data.settings.shiftChips = remote.settings.shiftChips;
if (remote.settings.colorRules) data.settings.colorRules = remote.settings.colorRules;
if (remote.settings.breakRules) data.settings.breakRules = remote.settings.breakRules;
if (remote.settings.staff) data.settings.staff = remote.settings.staff;
if (remote.settings.monthlyTargetsByMonth) data.settings.monthlyTargetsByMonth = remote.settings.monthlyTargetsByMonth;
}
data.weekPlan = remote.weekPlan || {};
data.manualExtra = remote.manualExtra || {};
_applyingRemote = false;
if (isUpdate && !state.modal && !state.showSettings && !state.clearMenuOpen && !state.weekPickerOpen) {
render();
}
}

async function fbSaveNow() {
const fb = window.__fb;
if (!fb || !_fbReady) return;
setSyncBadge('saving');
try {
await fb.setDoc(fb.doc(fb.db, ...FB_DOC_PATH), {
settings: data.settings,
weekPlan: data.weekPlan,
manualExtra: data.manualExtra,
});
setSyncBadge('online');
} catch (e) {
console.error('Kayıt hatası:', e);
setSyncBadge('offline');
}
}

function lsSave() {
if (_applyingRemote) return;
clearTimeout(_saveTimer);
_saveTimer = setTimeout(() => { if (_fbReady) fbSaveNow(); }, 400);
}

function setSyncBadge(mode) {
const el = document.getElementById('syncBadge');
if (!el) return;
el.className = 'sync-badge ' + mode;
if (mode === 'online') el.innerHTML = '<span class="dot"></span> CANLI';
else if (mode === 'saving') el.innerHTML = '<span class="dot"></span> KAYDEDİLİYOR';
else el.innerHTML = '<span class="dot"></span> OFFLINE';
}

const setBtn = el('settingsBtn'); if (setBtn) setBtn.onclick = openSettings;
const addBtn = el('addStaffBtn'); if (addBtn) addBtn.onclick = openStaffManager;
const clrBtn = el('openClearBtn'); if (clrBtn) clrBtn.onclick = openClearMenu;

document.querySelectorAll('[data-ht-month-shift]').forEach(e => { e.onclick = () => shiftMonth(parseInt(e.dataset.htMonthShift, 10)); });
const htNav = el('htNavLabel'); if (htNav) htNav.onclick = () => { state.showMonthPicker = !state.showMonthPicker; render(); };

document.querySelectorAll('[data-week-shift]').forEach(e => { e.onclick = () => shiftWeek(parseInt(e.dataset.weekShift, 10)); });
const wpBtn = el('openWeekPicker'); if (wpBtn) wpBtn.onclick = openWeekPicker;
document.querySelectorAll('[data-close-week-picker]').forEach(e => { e.onclick = () => closeWeekPicker(); });
document.querySelectorAll('[data-wp-year]').forEach(e => { e.onclick = () => wpChangeYear(parseInt(e.dataset.wpYear, 10)); });
document.querySelectorAll('[data-wp-month]').forEach(e => { e.onclick = () => wpPickMonth(parseInt(e.dataset.wpMonth, 10)); });
document.querySelectorAll('[data-wp-week]').forEach(e => {
e.onclick = () => {
const [y, mo, d] = e.dataset.wpWeek.split('-').map(Number);
wpPickWeek(new Date(y, mo - 1, d));
};
});

document.querySelectorAll('[data-close-clear]').forEach(e => { e.onclick = () => closeClearMenu(); });
document.querySelectorAll('[data-clear-staff]').forEach(e => { e.onclick = () => toggleClearStaff(e.dataset.clearStaff); });
document.querySelectorAll('[data-clear-day]').forEach(e => { e.onclick = () => toggleClearDay(parseInt(e.dataset.clearDay, 10)); });
document.querySelectorAll('[data-clear-all-staff]').forEach(e => { e.onclick = () => selectAllClearStaff(); });
document.querySelectorAll('[data-clear-all-days]').forEach(e => { e.onclick = () => selectAllClearDays(); });
document.querySelectorAll('[data-apply-clear]').forEach(e => { e.onclick = () => applyClear(); });

document.querySelectorAll('[data-plan-cell]').forEach(e => {
e.onclick = () => openShiftEdit(e.dataset.staff, e.dataset.date);
});
document.querySelectorAll('[data-warning-staff]').forEach(e => {
e.onclick = () => goToWarningCell(e.dataset.warningStaff, e.dataset.warningDate);
});
const monthToggle = el('monthPickerToggle');
if (monthToggle) monthToggle.onclick = (ev) => { ev.stopPropagation(); state.showMonthPicker = !state.showMonthPicker; render(); };
document.querySelectorAll('[data-month-offset]').forEach(e => {
e.onclick = (ev) => {
ev.stopPropagation();
const newOffset = parseInt(e.dataset.monthOffset, 10);
state.selectedMonthOffset = newOffset;
state.showMonthPicker = false;
if (newOffset === 0) {
const today = new Date();
const day = today.getDay();
const diff = day === 0 ? -6 : 1 - day;
const mon = new Date(today); mon.setDate(today.getDate() + diff); mon.setHours(0,0,0,0);
state.weekAnchorDate = mon;
} else {
state.weekAnchorDate = getFirstMondayOfMonth(newOffset);
}
render();
};
});
const targetDisplay = el('hourTargetDisplay');
if (targetDisplay) {
targetDisplay.addEventListener('dblclick', (ev) => { ev.preventDefault(); state.editingHourTarget = true; render(); });
let lastTap = 0;
targetDisplay.addEventListener('touchend', (ev) => {
const now = Date.now();
if (now - lastTap < 350) { ev.preventDefault(); state.editingHourTarget = true; render(); lastTap = 0; }
else { lastTap = now; }
});
}
const targetInput = el('hourTargetInput');
if (targetInput) {
setTimeout(() => { targetInput.focus(); targetInput.select(); }, 50);
targetInput.addEventListener('keydown', (ev) => {
if (ev.key === 'Enter') { ev.preventDefault(); saveHourTarget(); }
if (ev.key === 'Escape') { state.editingHourTarget = false; render(); }
});
targetInput.addEventListener('blur', () => { if (state.editingHourTarget) saveHourTarget(); });
}
document.querySelectorAll('[data-receivable-hours-cell]').forEach(e => {
e.ondblclick = (ev) => { ev.stopPropagation(); state.editingReceivableStaffId = e.dataset.receivableHoursCell; render(); };
let lastTap = 0;
e.addEventListener('touchend', (ev) => {
const now = Date.now();
if (now - lastTap < 350) { ev.preventDefault(); ev.stopPropagation(); state.editingReceivableStaffId = e.dataset.receivableHoursCell; render(); lastTap = 0; }
else { lastTap = now; }
});
});
const mInp = el('manualExtraInput');
if (mInp) {
setTimeout(() => { mInp.focus(); mInp.select(); }, 30);
const commit = () => { if (state.editingReceivableStaffId) saveReceivableInput(state.editingReceivableStaffId); };
mInp.addEventListener('keydown', (ev) => {
if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
if (ev.key === 'Escape') { state.editingReceivableStaffId = null; render(); }
});
mInp.addEventListener('blur', commit);
}
document.querySelectorAll('[data-chip-id]').forEach(e => { e.onclick = () => selectChip(e.dataset.chipId); });
document.querySelectorAll('[data-pick-hour]').forEach(e => { e.onclick = () => pickHour(e.dataset.pickHour, parseInt(e.dataset.hour, 10)); });
document.querySelectorAll('[data-pick-minute]').forEach(e => { e.onclick = () => pickMinute(e.dataset.pickMinute, parseInt(e.dataset.minute, 10)); });
document.querySelectorAll('[data-go-manual]').forEach(e => { e.onclick = () => goToManual(); });
document.querySelectorAll('[data-go-save-manual]').forEach(e => {
e.onclick = () => {
const m = state.modal; if (!m) return;
const sEl = el('manStart'); const eEl = el('manEnd');
if (sEl && sEl.value) { const [h, mi] = sEl.value.split(':'); m.startHour = parseInt(h, 10); m.startMinute = parseInt(mi, 10); }
if (eEl && eEl.value) { const [h, mi] = eEl.value.split(':'); m.endHour = parseInt(h, 10); m.endMinute = parseInt(mi, 10); }
autoSaveShift(false);
};
});
document.querySelectorAll('[data-modal-cancel]').forEach(e => { e.onclick = () => { state.modal = null; state.editingStaff = null; render(); }; });
document.querySelectorAll('[data-modal-delete]').forEach(e => { e.onclick = () => deleteShiftEdit(); });
document.querySelectorAll('[data-toggle-alacak]').forEach(e => { e.onclick = () => toggleAlacak(); });
document.querySelectorAll('[data-alacak-quick]').forEach(e => { e.onclick = () => { if (e.disabled) return; setAlacakHours(parseFloat(e.dataset.alacakQuick)); }; });
document.querySelectorAll('[data-close-emoji]').forEach(e => { e.onclick = () => { state.chipEditEmojiTarget = null; render(); }; });
document.querySelectorAll('[data-emoji]').forEach(e => {
e.onclick = () => {
const idx = state.chipEditEmojiTarget;
if (idx !== null && state.editingSettings && state.editingSettings.shiftChips[idx]) state.editingSettings.shiftChips[idx].icon = e.dataset.emoji;
state.chipEditEmojiTarget = null; render();
};
});
document.querySelectorAll('[data-edit-staff]').forEach(e => { e.onclick = () => openStaffForm(e.dataset.editStaff); });
document.querySelectorAll('[data-del-staff]').forEach(e => { e.onclick = () => deleteStaff(e.dataset.delStaff); });
const addStaffList = el('addStaffInListBtn'); if (addStaffList) addStaffList.onclick = () => openStaffForm();
const saveStaffBtn = el('saveStaffFormBtn');
if (saveStaffBtn) saveStaffBtn.onclick = () => {
const nameEl = el('staffNameInput'); const titleEl = el('staffTitleInput');
if (nameEl) state.editingStaff.name = nameEl.value.trim();
if (titleEl) state.editingStaff.title = titleEl.value.trim();
saveStaffForm();
};
document.querySelectorAll('[data-staff-name-cell]').forEach(e => {
e.ondblclick = (ev) => { ev.stopPropagation(); state.editingStaffNameId = e.dataset.staffNameCell; render(); };
let lastTap = 0;
e.addEventListener('touchend', (ev) => {
const now = Date.now();
if (now - lastTap < 350) { ev.preventDefault(); ev.stopPropagation(); state.editingStaffNameId = e.dataset.staffNameCell; render(); lastTap = 0; }
else { lastTap = now; }
});
});
const nameInp = el('staffNameInlineInput');
if (nameInp) {
setTimeout(() => { nameInp.focus(); nameInp.select(); }, 30);
const commit = () => {
const val = nameInp.value.trim();
const sid = state.editingStaffNameId;
if (sid && val) {
const st = data.settings.staff.find(s => s.id === sid);
if (st) st.name = val;
lsSave();
}
state.editingStaffNameId = null;
render();
};
nameInp.addEventListener('keydown', (ev) => {
if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
if (ev.key === 'Escape') { state.editingStaffNameId = null; render(); }
});
nameInp.addEventListener('blur', commit);
}
document.querySelectorAll('[data-receivable-staff]').forEach(e => {
e.onclick = (ev) => {
if (ev.target.closest('[data-staff-name-cell]') || ev.target.closest('input') || ev.target.closest('[data-receivable-hours-cell]')) return;
const sid = e.dataset.receivableStaff;
const earned = getExtraHours(sid, state.selectedMonthOffset || 0);
const used = getUsedReceivableHours(sid, state.selectedMonthOffset || 0);
if (earned <= 0.01 && used <= 0.01) return;
state.receivableDetailStaffId = sid;
render();
};
});
document.querySelectorAll('[data-close-receivable-detail]').forEach(e => { e.onclick = () => { state.receivableDetailStaffId = null; render(); }; });
document.querySelectorAll('[data-warn-edit]').forEach(e => { e.onclick = () => { state.warnConfirm = null; render(); }; });
document.querySelectorAll('[data-warn-apply]').forEach(e => { e.onclick = () => { autoSaveShift(true); }; });
if (state.showSettings) renderSettingsContent();
}

// ============ BAŞLAT ============
render();
initFirebase();

setInterval(() => {
state.now = new Date();
const c = document.querySelector('.dt-clock');
if (c) c.textContent = fmtTime(state.now);
}, 30000);
</script>
</body>
</html>
